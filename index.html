<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'/>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'/>
<title>Oncedshop</title>
<script src='https://telegram.org/js/telegram-web-app.js'></script>
<style>
:root{
  --bg: #000000;
  --bg-card: #0a0a0a;
  --accent: #ffffff;
  --text: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.7);
  --text-muted: rgba(255, 255, 255, 0.45);
  --border: rgba(255, 255, 255, 0.1);
  --radius-pill: 99px;
  --radius-md: 16px;
  --font-main: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}
html,body{margin:0;padding:0;min-height:100%;background:#000;color-scheme: dark;}
body{font-family:var(--font-main); color:var(--text); display:flex;justify-content:center; overflow-x:hidden; -webkit-font-smoothing: antialiased;}
#app{width:100%;max-width:500px;min-height:100vh;padding-bottom:120px;opacity:0;transition:opacity 0.6s ease;}
#app.show{opacity:1;}

.splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;transition:0.5s;}
.splash.hide{opacity:0;visibility:hidden;}
.splash-logo{width:80px;height:80px;border-radius:20px;background:#fff;color:#000;font-size:40px;font-weight:900;display:grid;place-items:center;animation:logoPulse 1.5s infinite alternate ease-in-out;}
@keyframes logoPulse{from{transform:scale(1);}to{transform:scale(1.1);box-shadow:0 0 30px rgba(255,255,255,0.2);}}

.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:20px;background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:12px;}
.logo-sm{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;color:#000;}

.pill-group{display:flex;background:rgba(255,255,255,0.08);border-radius:var(--radius-pill);padding:2px;position:relative;border:1px solid var(--border);width:84px;height:32px;}
.pill-group button{all:unset;flex:1;height:100%;font-size:11px;font-weight:800;color:var(--text-muted);cursor:pointer;z-index:2;position:relative;text-align:center;}
.pill-group button.on{color:#000;}
.pill-mover{position:absolute;top:2px;bottom:2px;width:40px;background:#fff;border-radius:var(--radius-pill);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);z-index:1;}

.hero{margin:16px;padding:28px;border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,0.05),rgba(0,0,0,0));border:1px solid var(--border);}
.hero h1{margin:0;font-size:26px;font-weight:800;}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 20px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;}
.chip.on{background:#fff;color:#000;}

.card{display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;margin:0 16px 12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);animation:cardIn 0.5s ease backwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
.pic{width:52px;height:52px;flex:0 0 52px;border-radius:12px;background:rgba(255,255,255,0.02);display:grid;place-items:center;font-size:24px;overflow:hidden;position:relative;}
.pic img{width:100%;height:100%;object-fit:contain;}

.pinfo .t{font-size:15px;font-weight:600;}
.pinfo .n{font-size:11px;color:var(--text-muted);margin-top:2px;}
.pinfo .pr{font-size:16px;font-weight:700;margin-top:4px;}
.add-btn{all:unset;width:44px;height:44px;border-radius:12px;background:#fff;color:#000;display:grid;place-items:center;font-size:24px;margin-left:auto;cursor:pointer;}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:calc(100% - 32px);max-width:448px;z-index:100;display:flex;padding:8px;background:rgba(20,20,20,0.8);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;}
.nav button{all:unset;flex:1;text-align:center;padding:8px 0;color:var(--text-muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.nav button.on{color:#fff;}

.bg-watermark{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-10deg);font-size:18vw;font-weight:900;color:rgba(255,255,255,0.02);z-index:-1;text-transform:uppercase;pointer-events:none;}

.backdrop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.8);opacity:0;pointer-events:none;transition:0.3s;display:flex;align-items:flex-end;justify-content:center;}
.backdrop.show{opacity:1;pointer-events:auto;}
.sheet{width:100%;max-width:500px;background:#111;border-top:1px solid var(--border);border-radius:24px 24px 0 0;padding:24px 20px 40px;transform:translateY(100%);transition:0.4s cubic-bezier(0.4,0,0.2,1);max-height:85vh;overflow-y:auto;}
.backdrop.show .sheet{transform:translateY(0);}

.tile{display:flex;align-items:center;gap:12px;padding:16px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;cursor:pointer;}
.tile small{display:block;font-size:11px;color:var(--text-muted);margin-top:2px;}
.field{width:100%;padding:14px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:#fff;margin-top:8px;}

.cta{all:unset;display:block;text-align:center;padding:16px;border-radius:14px;background:#fff;color:#000;font-weight:800;margin-top:20px;cursor:pointer;}
.cta.dark{background:rgba(255,255,255,0.1);color:#fff;border:1px solid var(--border);}
.crow{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;padding:12px;margin:8px 0;}
.addr{font-family:monospace;font-size:10px;word-break:break-all;color:var(--text-muted);margin-top:6px;}
</style>
</head>
<body>
<div id='splash' class='splash'><div class='splash-logo'>O</div></div>
<div class='bg-watermark'>Oncedshop</div>
<div id='app'>
  <div class='topbar'>
    <div class='brand'><div class='logo-sm'>O</div><div><div style='font-weight:800'>Oncedshop</div><div style='font-size:10px;color:var(--text-muted)' id='tagline'>Digital Store</div></div></div>
    <div style='display:flex;gap:8px'>
      <div class='pill-group'><div class='pill-mover' id='curMover'></div><button data-cur='USD'>$</button><button data-cur='RUB'>₽</button></div>
      <div class='pill-group'><div class='pill-mover' id='langMover'></div><button data-lang='ru'>RU</button><button data-lang='en'>EN</button></div>
    </div>
  </div>
  <div id='view'></div>
</div>
<div class='nav' id='nav-bar'>
  <button id='nav-catalog' data-tab='catalog'>🛍️<span id='l-cat'>Catalog</span></button>
  <button id='nav-cart' data-tab='cart'>❤️<span id='l-cart'>Cart</span><span id='cartBadge' style='display:none;background:#fff;color:#000;font-size:10px;padding:2px 6px;border-radius:10px;margin-left:4px'>0</span></button>
  <button id='nav-cabinet' data-tab='cabinet'>👤<span id='l-cab'>Profile</span></button>
</div>
<div class='backdrop' id='backdrop'><div class='sheet' id='sheet'></div></div>
<div class='toast' id='toast' style='position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;opacity:0;transition:0.3s;pointer-events:none;z-index:1000'></div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
const MARKUP = 0.12;
const CRYPTO = [
  {name:'TON', addr:'UQDEvKC6YHjTxgq8nsJyK33LRPcqHUEtgebTIM1oPGyPzKs2', icon:'💎'},
  {name:'USDT TRC20', addr:'TTaXvZ3g9qnLnEGKd9NBP6CNrH5tk35eB6', icon:'🟢'},
  {name:'Bitcoin', addr:'bc1qc7j2jnt3sdrnwhkf9l3uudjan3y3qjjuv0park', icon:'🟠'}
];
const CATALOG = [
  {id:'stars',title:{ru:'Telegram Stars',en:'Stars'},items:[{id:'p_stars',title:{ru:'Stars 1000',en:'Stars 1000'},img:'https://img.icons8.com/color/96/telegram-app.png',base:12,unit:'Stars'}]},
  {id:'tiktok',title:{ru:'TikTok',en:'TikTok'},items:[{id:'p_tt',title:{ru:'TikTok Монеты',en:'TikTok Coins'},img:'https://img.icons8.com/color/96/tiktok.png',base:0.0105,unit:'Монет',kind:'perUnit'}]},
  {id:'virta',title:{ru:'Вирты',en:'Virts'},items:[
    {id:'p_maj',title:{ru:'Majestic',en:'Majestic'},img:'https://img.icons8.com/color/96/get-revenue.png',base:2.11,unit:'1kk',kind:'perUnit'},
    {id:'p_arz',title:{ru:'Arizona',en:'Arizona'},img:'https://img.icons8.com/color/96/get-revenue.png',base:2.63,unit:'1kkk',kind:'perUnit'}
  ]},
  {id:'ai',title:{ru:'AI Подписки',en:'AI Subs'},items:[
    {id:'p_gpt',title:{ru:'ChatGPT Plus',en:'ChatGPT Plus'},img:'https://img.icons8.com/color/96/chatgpt.png',base:3.15,unit:'мес'},
    {id:'p_gem',title:{ru:'Gemini 18m',en:'Gemini 18m'},img:'https://img.icons8.com/color/96/google-logo.png',base:1.05,unit:'акк'}
  ]}
];
let state = {tab:'catalog', lang:'ru', currency:'USD', rate:95, cart:[], cat:'all'};

function T(k){
  const sys={
    ru:{tagline:'Цифровой магазин',catalog:'Каталог',cart:'Корзина',cabinet:'Профиль',all:'Все',added:'Добавлено!'},
    en:{tagline:'Digital Store',catalog:'Catalog',cart:'Cart',cabinet:'Profile',all:'All',added:'Added!'}
  };
  return sys[state.lang][k]||k;
}

function money(x){
  return state.currency==='RUB'?(Math.round(x*state.rate).toLocaleString()+' ₽'):('$'+Number(x).toFixed(2));
}

function render(){
  document.getElementById('tagline').textContent = T('tagline');
  document.getElementById('l-cat').textContent = T('catalog');
  document.getElementById('l-cart').textContent = T('cart');
  document.getElementById('l-cab').textContent = T('cabinet');
  document.getElementById('curMover').style.transform = state.currency==='RUB'?'translateX(40px)':'translateX(0)';
  document.getElementById('langMover').style.transform = state.lang==='en'?'translateX(40px)':'translateX(0)';
  
  const v = document.getElementById('view');
  if(state.tab==='catalog'){
    let h = `<div class="chips"><div class="chip ${state.cat==='all'?'on':''}" data-cat="all">${T('all')}</div>`;
    CATALOG.forEach(c => h += `<div class="chip ${state.cat===c.id?'on':''}" data-cat="${c.id}">${c.title[state.lang]}</div>`);
    h += '</div><div class="hero"><h1>ONCEDSHOP</h1><div style="font-size:14px;color:var(--text-secondary);margin-top:8px">Лучшие цены и мгновенная выдача</div></div>';
    (state.cat==='all'?CATALOG:CATALOG.filter(c=>c.id===state.cat)).forEach(c => c.items.forEach(p => {
      h += `<div class="card"><div class="pic"><img src="${p.img}"></div><div class="pinfo"><div class="t">${p.title[state.lang]}</div><div class="pr">${money(p.base*(1+MARKUP))} <small>/ ${p.unit}</small></div></div><button class="add-btn" data-add="${p.id}">+</button></div>`;
    }));
    v.innerHTML = h;
  } else if(state.tab==='cart'){
    if(!state.cart.length) v.innerHTML = '<div style="padding:60px;text-align:center;color:var(--text-muted)">🛒 Корзина пуста</div>';
    else {
      let h = '<div style="padding:20px">';
      state.cart.forEach(i => h += `<div class="tile"><div>${i.name}</div><div style="margin-left:auto">${money(i.price)}</div></div>`);
      h += '<input id="contact" class="field" placeholder="Ник / Почта для выдачи"><button class="cta" onclick="checkout()">Оформить заказ</button></div>';
      v.innerHTML = h;
    }
  } else {
    v.innerHTML = '<div style="padding:20px"><div class="tile">👤 Guest<small>ID: ---</small></div><div class="tile" onclick="openCrypto()">💎 Оплата криптой<small>Адреса кошельков</small></div></div>';
  }
  document.getElementById('nav-catalog').className = state.tab==='catalog'?'on':'';
  document.getElementById('nav-cart').className = state.tab==='cart'?'on':'';
  document.getElementById('nav-cabinet').className = state.tab==='cabinet'?'on':'';
}

function openCrypto(){
  let h = '<div class="grab"></div><h3>Оплата криптой</h3>';
  CRYPTO.forEach(c => h += `<div class="crow"><b>${c.icon} ${c.name}</b><div class="addr">${c.addr}</div></div>`);
  h += '<button class="cta dark" onclick="closeSheet()">Закрыть</button>';
  document.getElementById('sheet').innerHTML = h;
  document.getElementById('backdrop').classList.add('show');
}

function closeSheet(){ document.getElementById('backdrop').classList.remove('show'); }

function toast(m){
  const e = document.getElementById('toast');
  e.textContent = m; e.style.opacity = 1;
  setTimeout(()=>e.style.opacity=0, 2000);
}

function checkout(){
  const c = document.getElementById('contact')?.value;
  if(!c) return toast('Укажите данные для выдачи');
  const order = {type:'order', contact:c, items:state.cart};
  if(tg) tg.sendData(JSON.stringify(order));
  toast('Заказ отправлен!');
  state.cart = []; render();
}

function init(){
  if(tg){tg.ready();tg.expand();}
  render();
  setTimeout(()=>{document.getElementById('splash').classList.add('hide');document.getElementById('app').classList.add('show');},1200);
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-tab],[data-lang],[data-cur],[data-cat],[data-add]');
  if(!el) return;
  const d = el.dataset;
  if(d.tab){state.tab=d.tab;render();}
  if(d.lang){state.lang=d.lang;render();}
  if(d.cur){state.currency=d.cur;render();}
  if(d.cat){state.cat=d.cat;render();}
  if(d.add){
    CATALOG.forEach(c => c.items.forEach(p => {
      if(p.id===d.add){ state.cart.push({id:p.id, name:p.title[state.lang], price:p.base*(1+MARKUP)}); toast(T('added')); }
    }));
    render();
  }
});
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
