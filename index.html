<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'/>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'/>
<title>Oncedshop</title>
<script src='https://telegram.org/js/telegram-web-app.js'></script>
<style>
:root{
  --bg: #000000; --accent: #ffffff; --text: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.7);
  --text-muted: rgba(255, 255, 255, 0.45);
  --border: rgba(255, 255, 255, 0.1);
  --border-bright: rgba(255, 255, 255, 0.2);
  --radius-pill: 99px; --radius-lg: 28px; --radius-md: 20px; --radius-sm: 14px;
  --font-main: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;user-select:none;}
html,body{margin:0;padding:0;min-height:100%;background:#000;color-scheme: dark; overflow-x: hidden; touch-action: pan-y;}
body{font-family:var(--font-main); color:var(--text); display:flex;justify-content:center; -webkit-font-smoothing: antialiased;}

/* ===== CHIPS ===== */
.chips{display:flex;gap:8px;padding:4px 16px 12px;overflow-x:auto;scrollbar-width:none;cursor:grab;}
.chips::-webkit-scrollbar{display:none;}
.chips:active{cursor:grabbing;}
.chip{padding:10px 18px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:var(--radius-pill);font-size:13px;font-weight:700;white-space:nowrap;transition:0.2s;}
.chip.on{background:#fff;color:#000;border-color:#fff;}
#app{width:100%;max-width:500px;min-height:100vh;padding-bottom:140px;opacity:0;transition:opacity 0.6s ease;}
#app.show{opacity:1;}

/* ===== SPLASH ===== */
.splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;transition:0.5s;}
.splash.hide{opacity:0;visibility:hidden;}
.splash-logo{width:84px;height:84px;border-radius:24px;background:#fff;color:#000;font-size:44px;font-weight:900;display:grid;place-items:center;animation:logoPulse 1.5s infinite alternate ease-in-out;}
@keyframes logoPulse{from{transform:scale(1);}to{transform:scale(1.1);box-shadow:0 0 35px rgba(255,255,255,0.25);}}

/* ===== TOPBAR ===== */
@keyframes pulse { from { opacity: 0.2; } to { opacity: 0.8; } }

.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;background:rgba(0,0,0,0.8);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:12px;}
.logo-sm{width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;color:#000;}

.pill-group{display:flex;background:rgba(255,255,255,0.1);border-radius:var(--radius-pill);padding:2px;position:relative;border:1px solid var(--border);width:84px;height:32px;margin-left:8px;}
.pill-group button{all:unset;flex:1;height:100%;font-size:11px;font-weight:800;color:var(--text-muted);cursor:pointer;z-index:2;position:relative;text-align:center;}
.pill-group button.on{color:#000;}
.pill-mover{position:absolute;top:2px;bottom:2px;width:40px;background:#fff;border-radius:var(--radius-pill);transition:transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);z-index:1;pointer-events:none;}

/* ===== HERO & BLACK HOLE ===== */
.hero{margin:16px;padding:50px 24px;border-radius:var(--radius-lg);background:#000;border:1px solid var(--border);position:relative;overflow:hidden;}
.hero h1{margin:0;font-size:36px;font-weight:900;letter-spacing:-2px;position:relative;z-index:10; color:#fff; text-shadow: 0 0 30px rgba(0,0,0,1);}
.bh-container { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0.8; }
.bh-core { width: 130px; height: 130px; background: #000; border-radius: 50%; box-shadow: 0 0 60px 10px rgba(255,255,255,0.15), inset 0 0 20px rgba(255,255,255,0.3); position: relative; z-index: 2; }
.bh-ring { position: absolute; width: 320px; height: 320px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.08); animation: bhRotate 15s linear infinite; }
.bh-ring::before { content: ''; position: absolute; inset: -20px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%); mask: radial-gradient(circle, transparent 40%, black 100%); -webkit-mask: radial-gradient(circle, transparent 40%, black 100%); }
.bh-ring:nth-child(2) { animation-duration: 25s; width: 260px; height: 260px; opacity: 0.6; }
@keyframes bhRotate { from{transform:rotate(0deg) scale(1);} to{transform:rotate(360deg) scale(1.05);} }

/* ===== CARDS ===== */
.card{display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--radius-md);margin:0 16px 12px;background:rgba(255,255,255,0.05);border:1px solid var(--border);transition:all 0.3s ease;animation:cardIn 0.5s ease backwards;will-change: transform, opacity;}
.card.adding { transform: scale(1.02); border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); }
@keyframes cardIn{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
.pic{width:82px;height:82px;flex:0 0 82px;border-radius:22px;background:rgba(255,255,255,0.03);border:1px solid var(--border);display:grid;place-items:center;overflow:hidden;position:relative;}
.pic img{width:80%;height:80%;object-fit:contain;}

.pinfo{flex:1;min-width:0;}
.pinfo .t{font-size:16px;font-weight:800;letter-spacing:-0.3px;}
.pinfo .n{font-size:11px;color:var(--text-secondary);line-height:1.4;margin-top:4px;font-weight:500;}
.pinfo .pr{font-size:17px;font-weight:900;margin-top:6px;color:var(--accent);}

.add-btn{all:unset;width:48px;height:48px;border-radius:16px;background:#fff;color:#000;display:grid;place-items:center;font-size:26px;font-weight:300;cursor:pointer;margin-left:auto;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1);-webkit-tap-highlight-color: transparent;}
.add-btn:active{transform:scale(0.85); background: #eee;}
.add-btn.added-anim { background: #00ff88 !important; color: #000 !important; transform: scale(1.1); }

/* ===== NAV ===== */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:calc(100% - 32px);max-width:440px;z-index:100;display:flex;padding:10px;background:rgba(22,22,22,0.85);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.14);border-radius:var(--radius-lg);box-shadow:0 15px 45px rgba(0,0,0,0.6);}
.nav button{all:unset;flex:1;text-align:center;padding:8px 0;color:var(--text-muted);font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:0.2s;-webkit-tap-highlight-color: transparent;}
.nav button.on{color:#fff;}
.nav button .ic{font-size:22px;opacity:0.5;transition:0.2s;display:block;}
.nav button.on .ic{opacity:1;transform:translateY(-3px) scale(1.1);}
.nbadge{background:var(--accent);color:#000;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:900;position:absolute;top:-5px;right:calc(50% - 20px);border:2px solid #161616;}

/* ===== REVIEWS ===== */
.rev-card{padding:20px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius-md);margin:0 16px 16px; animation: revIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;}
@keyframes revIn {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.rev-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.rev-avatar{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.1);display:grid;place-items:center;font-weight:900;font-size:14px;color:var(--accent);border:1px solid var(--border);}
.rev-stars{color:#ffb800;font-size:12px;margin-top:2px;}

/* ===== CABINET & PROFILE ===== */
.user-card {
  padding: 24px;
  background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
  border: 1px solid var(--border-bright);
  border-radius: var(--radius-lg);
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.user-card::after {
  content: '';
  position: absolute;
  top: -50px;
  right: -50px;
  width: 120px;
  height: 120px;
  background: var(--accent);
  filter: blur(80px);
  opacity: 0.15;
  pointer-events: none;
}
.user-avatar-lg {
  width: 64px;
  height: 64px;
  border-radius: 22px;
  background: #fff;
  color: #000;
  display: grid;
  place-items: center;
  font-size: 32px;
  font-weight: 900;
  margin-bottom: 16px;
  box-shadow: 0 8px 20px rgba(255,255,255,0.2);
}
.user-name-big { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
.user-status-tag { display: inline-block; padding: 4px 10px; background: rgba(255,255,255,0.1); border-radius: 8px; font-size: 10px; font-weight: 800; margin-top: 8px; color: var(--text-secondary); text-transform: uppercase; }

.tile{padding:18px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius-md);display:flex;align-items:center;gap:16px;margin-bottom:12px;transition: 0.3s;}
.tile.active{border-color:var(--accent);background:rgba(255,255,255,0.07);box-shadow: 0 0 25px rgba(255,255,255,0.04);}
.tile .icon{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,0.06);display:grid;place-items:center;font-size:24px;border:1px solid var(--border);transition: 0.3s;}
.tile.active .icon{background: #fff; color: #000; transform: scale(1.05);}
.tile .info{flex:1;}
.tile .label{font-size:11px;color:var(--text-muted);margin-bottom:2px;text-transform: uppercase; letter-spacing: 0.5px;}
.tile .value{font-size:16px;font-weight:800;}

.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;}
.pay-item{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:20px;padding:18px 8px;text-align:center;transition:0.3s;}
.pay-item:hover { background: rgba(255,255,255,0.06); transform: translateY(-2px); }
.pay-item img{width:32px;height:32px;margin-bottom:8px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));}
.pay-item .name{font-size:12px;font-weight:800;color:var(--text-secondary);}

.status-pill{font-size:9px;font-weight:900;padding:4px 8px;border-radius:8px;background:var(--accent);color:#000;text-transform:uppercase;margin-left:auto; box-shadow: 0 0 10px rgba(255,255,255,0.3);}

.pay-selector{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0;}
.pay-opt{padding:14px 8px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:16px;text-align:center;font-size:12px;font-weight:700;transition:0.2s;cursor:pointer;white-space:nowrap;}
.pay-opt.on{background:#fff;color:#000;border-color:#fff;}

.rev-form{padding:20px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:20px;}
.rev-stars-select{display:flex;gap:8px;margin-bottom:16px;font-size:24px;cursor:pointer;}
.rev-stars-select span{opacity:0.3;transition:0.2s;}
.rev-stars-select span.on{opacity:1;filter:drop-shadow(0 0 5px rgba(255,184,0,0.5));}
.rev-input{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;padding:12px;color:#fff;font-family:inherit;margin-bottom:12px;resize:none;}
.rev-submit{width:100%;height:44px;background:var(--accent);color:#000;border-radius:12px;font-weight:800;border:none;cursor:pointer;}

/* ===== FLYING ITEM ===== */
.flying-item {
  position: fixed;
  z-index: 1000;
  pointer-events: none;
  transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: 12px;
  overflow: hidden;
}

/* ===== ABOUT PAGE ===== */
.about-box { padding: 20px; }
.about-card {
  padding: 24px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 20px;
}
.about-card h3 { margin: 0 0 12px; color: var(--accent); }
.about-card p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--text-secondary); }

.btn-primary.loading {
  opacity: 0.7;
  pointer-events: none;
  position: relative;
  color: transparent !important;
}
.btn-primary.loading::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  top: calc(50% - 10px);
  left: calc(50% - 10px);
  border: 3px solid rgba(0,0,0,0.1);
  border-top-color: #000;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-msg {
  background: rgba(255, 68, 68, 0.1);
  border: 1px solid rgba(255, 68, 68, 0.2);
  color: #ff4444;
  padding: 12px;
  border-radius: 12px;
  font-size: 13px;
  margin-top: 12px;
  text-align: center;
  display: none;
  animation: shake 0.4s ease;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.bg-watermark{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-10deg);font-size:18vw;font-weight:900;color:rgba(255,255,255,0.015);z-index:-1;text-transform:uppercase;pointer-events:none;user-select:none;}
</style>

</head>

function getProduct(pid){

  return null;
}

            <div class="rev-stars">${'⭐'.repeat(r.s)}</div>

  } else if(state.tab==='cabinet'){
    let h = '<div style="padding:20px"><h2>Профиль</h2>';
    h += `<div class="user-card"><div class="user-avatar-lg">G</div><div class="user-name-big">Guest User</div><div class="user-status-tag">Verified Buyer</div></div>`;
    
    h += `<div class="tile active"><div class="icon">💎</div><div class="info"><div class="label">Способ оплаты</div><div class="value">Crypto Pay</div></div><div class="status-pill">Active</div></div>`;
    h += `<div class="tile"><div class="icon">🆔</div><div class="info"><div class="label">Telegram ID</div><div class="value">000000000</div></div></div>`;
    
    h += '<div style="margin-top:32px"><div style="font-size:13px;font-weight:800;margin-bottom:16px;opacity:0.6;text-transform:uppercase;letter-spacing:1px">Доступные валюты</div>';
    h += '<div class="pay-grid">';
    h += '<div class="pay-item"><img src="https://img.icons8.com/color/96/bitcoin.png"><div class="name">BTC</div></div>';
    h += '<div class="pay-item"><img src="https://img.icons8.com/color/96/ethereum.png"><div class="name">ETH</div></div>';
    h += '<div class="pay-item"><img src="https://img.icons8.com/color/96/tether.png"><div class="name">USDT</div></div>';
    h += '</div></div>';

    h += '<button type="button" class="btn-primary" style="background:rgba(255,255,255,0.06);color:#fff;border:1px solid var(--border);margin-top:40px" onclick="window.open(\'https://t.me/oncedshop_support\')">Написать в поддержку</button>';
    h += '</div>';
    v.innerHTML = h;
  } else if(state.tab==='about'){
    let h = '<div class="about-box"><h2>О магазине</h2>';
    h += '<div class="about-card"><h3>🚀 Oncedshop</h3><p>Мы — ваш надежный проводник в мире цифровых товаров. Наша миссия — предоставлять качественные подписки и валюту по самым низким ценам на рынке.</p></div>';
    h += '<div class="about-card"><h3>⚡ Мгновенная доставка</h3><p>Большинство товаров доставляются автоматически сразу после оплаты. Мы ценим ваше время.</p></div>';
    h += '<div class="about-card"><h3>💎 Гарантия качества</h3><p>На все товары с пометкой "Гарантия" распространяется полная поддержка на весь срок действия подписки.</p></div>';
    h += '<div style="text-align:center;padding:20px;opacity:0.5;font-size:12px">© 2026 Oncedshop. Все права защищены.</div>';
    h += '</div>';
    v.innerHTML = h;

  document.getElementById('cartBadge').innerText = state.cart.length;
  document.getElementById('cartBadge').style.display = state.cart.length > 0 ? 'inline-block' : 'none';

  ['catalog','reviews','cart','cabinet','about'].forEach(t => {

    if(b) b.className = state.tab===t?'on':'';

function animateFly(targetEl) {
  const card = targetEl.closest('.card');
  const img = card.querySelector('.pic img');
  const cartBtn = document.getElementById('nav-cart');
  
  if(!img || !cartBtn) return;

  const rect = img.getBoundingClientRect();
  const cartRect = cartBtn.getBoundingClientRect();

  const clone = img.cloneNode(true);
  clone.className = 'flying-item';
  clone.style.width = rect.width + 'px';
  clone.style.height = rect.height + 'px';
  clone.style.top = rect.top + 'px';
  clone.style.left = rect.left + 'px';
  
  document.body.appendChild(clone);

  // Trigger reflow
  clone.offsetWidth;

  clone.style.top = (cartRect.top + cartRect.height/2) + 'px';
  clone.style.left = (cartRect.left + cartRect.width/2) + 'px';
  clone.style.width = '20px';
  clone.style.height = '20px';
  clone.style.opacity = '0';
  clone.style.transform = 'scale(0.1) rotate(360deg)';

  setTimeout(() => {
    clone.remove();
    cartBtn.style.transform = 'scale(1.2)';
    setTimeout(() => cartBtn.style.transform = '', 200);
  }, 800);
}

function setupDragScroll(id){
  const el = document.getElementById(id);
  if(!el) return;
  let isDown = false, startX, scrollLeft;
  el.addEventListener('mousedown', e => { isDown=true; el.classList.add('active'); startX=e.pageX-el.offsetLeft; scrollLeft=el.scrollLeft; });
  el.addEventListener('mouseleave', () => { isDown=false; el.classList.remove('active'); });
  el.addEventListener('mouseup', () => { isDown=false; el.classList.remove('active'); });
  el.addEventListener('mousemove', e => { if(!isDown) return; e.preventDefault(); const x=e.pageX-el.offsetLeft; const walk=(x-startX)*2; el.scrollLeft=scrollLeft-walk; });
}

async function updateRate() {
  state.rateLoading = true;
  document.getElementById('rateStatus').style.display = 'block';
  
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 3500); // 3s timeout for slow net

  try {
    const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD', { signal: controller.signal });
    const data = await res.json();
    if(data && data.rates && data.rates.RUB) {
      state.rate = data.rates.RUB;
      render();
    }
  } catch (e) {
    console.log('Rate fetch failed/timed out, using fallback');
  } finally {
    clearTimeout(timeoutId);
    state.rateLoading = false;
    const statusEl = document.getElementById('rateStatus');
    if(statusEl) statusEl.style.display = 'none';
  }
}

// Backup: force hide splash after 3.5s no matter what
setTimeout(() => {
  const s = document.getElementById('splash');
  const a = document.getElementById('app');
  if(s && !s.classList.contains('hide')) {
    console.log('Forced splash removal');
    s.classList.add('hide');
    if(a) a.classList.add('show');
  }
}, 3500);

function init(){
  console.log('Init started');
  try {
    if(tg){
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor('#000000'); } catch(e) {}
    }
    updateRate();
    render();
  } catch (e) {
    console.error('Init error:', e);
  } finally {
    setTimeout(() => {
      const s = document.getElementById('splash');
      const a = document.getElementById('app');
      if(s) s.classList.add('hide');
      if(a) a.classList.add('show');
      console.log('Splash hidden');
    }, 800); // Faster splash
  }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-lang],[data-cur],[data-cat],[data-add],[data-rem],[data-action],[data-pay],[data-revstars]');
  const d = el?.dataset;
  if(!d) return;
  e.preventDefault();
  
  if(d.action === 'checkout') {
    const btn = el;
    const errEl = document.getElementById('checkoutError');
    if(errEl) errEl.style.display = 'none';

    btn.classList.add('loading');
    if(tg) tg.HapticFeedback.notificationOccurred('success');

    setTimeout(() => {
      const payMap = {sbp:'СБП', crypto:'USDT/BTC', card:'Карта РФ', market:'Баланс'};
      const orderData = {
        action: 'checkout_appeal',
        payMethod: payMap[state.payMethod] || 'Не выбран',
        currency: state.currency,
        total: state.cart.reduce((sum, item) => {
          const p = getProduct(item.id);
          return sum + (p ? (p.kind==='perUnit' && p.base < 0.1 ? p.base * 1000 : p.base) * 1.12 : 0);
        }, 0).toFixed(2),
        items: state.cart.map(item => ({ id: item.id, name: getProduct(item.id)?.title[state.lang] }))
      };

      if(tg && tg.sendData) {
        tg.sendData(JSON.stringify(orderData));
        btn.classList.remove('loading');
      } else {
        console.log('Order data:', orderData);
        alert('Заявка отправлена в консоль (режим браузера)');
        btn.classList.remove('loading');
      }
    }, 600);
    return;
  }
  if(d.action === 'toggleRevForm') {
    state.showRevForm = !state.showRevForm;
    render();
    return;
  }
  if(d.action === 'submitRev') {
    if(tg && tg.showPopup) {
      tg.showPopup({title:'Успешно', message:'Ваш отзыв отправлен на модерацию!', buttons:[{type:'ok'}]});
    } else {
      alert('Ваш отзыв отправлен на модерацию!');
    }
    state.showRevForm = false;
    render();
    return;
  }
  if(d.revstars) {
    state.revStars = parseInt(d.revstars);
    render();
    return;
  }
  if(d.pay) {
    state.payMethod = d.pay;
    if(tg) tg.HapticFeedback.impactOccurred('light');
    render();
    return;
  }
  if(d.tab){ state.tab=d.tab; render(); window.scrollTo(0,0); }
  if(d.lang){ state.lang=d.lang; render(); }
  if(d.cur){ state.currency=d.cur; render(); }
  if(d.cat){ state.cat=d.cat; render(); }
  if(d.add){
    state.cart.push({id:d.add, q:1});
    if(tg) tg.HapticFeedback.impactOccurred('medium');
    
    // Fly Animation
    animateFly(el);
    
    // Button and card highlight
    const btn = el;
    const card = el.closest('.card');
    if(btn && card) {
      btn.classList.add('added-anim');
      card.classList.add('adding');
      setTimeout(() => { 
        btn.classList.remove('added-anim'); 
        card.classList.remove('adding');
        render(); 
      }, 400);
    } else {
      render();
    }
  }
  if(d.rem !== undefined){
    state.cart.splice(parseInt(d.rem), 1);
    if(tg) tg.HapticFeedback.impactOccurred('light');
    render();
  }
  if(tg && !d.add && d.rem===undefined) tg.HapticFeedback.impactOccurred('light');
});
document.addEventListener('DOMContentLoaded', init);
</script>
