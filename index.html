<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'/>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'/>
<title>Oncedshop</title>
<script src='https://telegram.org/js/telegram-web-app.js'></script>
<style>
:root{
  --bg: #000000; --accent: #ffffff; --text: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.7);
  --text-muted: rgba(255, 255, 255, 0.45);
  --border: rgba(255, 255, 255, 0.1);
  --border-bright: rgba(255, 255, 255, 0.2);
  --radius-pill: 99px; --radius-lg: 28px; --radius-md: 20px;
  --font-main: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;user-select:none;}
html,body{margin:0;padding:0;min-height:100%;background:#000;color-scheme: dark; overflow-x: hidden; touch-action: pan-y;}
body{font-family:var(--font-main); color:var(--text); display:flex;justify-content:center; -webkit-font-smoothing: antialiased;}

/* ===== CHIPS ===== */
.chips{display:flex;gap:8px;padding:4px 16px 12px;overflow-x:auto;scrollbar-width:none;cursor:grab;}
.chips::-webkit-scrollbar{display:none;}
.chips:active{cursor:grabbing;}
.chip{padding:8px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:var(--radius-pill);font-size:12px;font-weight:700;white-space:nowrap;transition:0.2s;}
.chip.on{background:#fff;color:#000;border-color:#fff;}
#app{width:100%;max-width:500px;min-height:100vh;padding-bottom:140px;opacity:0;transition:opacity 0.6s ease;}
#app.show{opacity:1;}

/* ===== SPLASH ===== */
.splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;transition:0.5s;}
.splash.hide{opacity:0;visibility:hidden;}
.splash-logo{width:80px;height:80px;border-radius:22px;background:#fff;color:#000;font-size:40px;font-weight:900;display:grid;place-items:center;animation:logoPulse 1.5s infinite alternate ease-in-out;}
@keyframes logoPulse{from{transform:scale(1);}to{transform:scale(1.1);box-shadow:0 0 30px rgba(255,255,255,0.2);}}

/* ===== TOPBAR ===== */
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;background:rgba(0,0,0,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:12px;}
.logo-sm{width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;color:#000;}

.pill-group{display:flex;background:rgba(255,255,255,0.08);border-radius:var(--radius-pill);padding:2px;position:relative;border:1px solid var(--border);width:84px;height:32px;margin-left:8px;}
.pill-group button{all:unset;flex:1;height:100%;font-size:11px;font-weight:800;color:var(--text-muted);cursor:pointer;z-index:2;position:relative;text-align:center;}
.pill-group button.on{color:#000;}
.pill-mover{position:absolute;top:2px;bottom:2px;width:40px;background:#fff;border-radius:var(--radius-pill);transition:transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);z-index:1;pointer-events:none;}

/* ===== HERO & BLACK HOLE ===== */
.hero{margin:16px;padding:50px 24px;border-radius:28px;background:#000;border:1px solid var(--border);position:relative;overflow:hidden;}
.hero h1{margin:0;font-size:36px;font-weight:900;letter-spacing:-2px;position:relative;z-index:10; color:#fff; text-shadow: 0 0 30px rgba(0,0,0,1);}
.bh-container { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0.8; }
.bh-core { width: 130px; height: 130px; background: #000; border-radius: 50%; box-shadow: 0 0 60px 10px rgba(255,255,255,0.15), inset 0 0 20px rgba(255,255,255,0.3); position: relative; z-index: 2; }
.bh-ring { position: absolute; width: 320px; height: 320px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.08); animation: bhRotate 15s linear infinite; }
.bh-ring::before { content: ''; position: absolute; inset: -20px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0%, rgba(255,255,255,0.2) 50%, transparent 100%); mask: radial-gradient(circle, transparent 40%, black 100%); -webkit-mask: radial-gradient(circle, transparent 40%, black 100%); }
.bh-ring:nth-child(2) { animation-duration: 25s; width: 260px; height: 260px; opacity: 0.6; }
@keyframes bhRotate { from{transform:rotate(0deg) scale(1);} to{transform:rotate(360deg) scale(1.05);} }

/* ===== CARDS ===== */
.card{display:flex;align-items:center;gap:16px;padding:18px;border-radius:24px;margin:0 16px 12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);transition:0.2s;animation:cardIn 0.5s ease backwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
.pic{width:60px;height:60px;flex:0 0 60px;border-radius:16px;background:rgba(255,255,255,0.03);display:grid;place-items:center;overflow:hidden;position:relative;}
.pic img{width:100%;height:100%;object-fit:contain;}

.pinfo{flex:1;min-width:0;}
.pinfo .t{font-size:15px;font-weight:800;}
.pinfo .n{font-size:10px;color:var(--text-secondary);line-height:1.4;margin-top:4px;font-weight:500;}
.pinfo .pr{font-size:16px;font-weight:900;margin-top:6px;color:var(--accent);}
.add-btn{all:unset;width:44px;height:44px;border-radius:14px;background:#fff;color:#000;display:grid;place-items:center;font-size:24px;cursor:pointer;margin-left:auto;}

/* ===== NAV ===== */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:calc(100% - 32px);max-width:440px;z-index:100;display:flex;padding:10px;background:rgba(20,20,20,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,0.5);}
.nav button{all:unset;flex:1;text-align:center;padding:8px 0;color:var(--text-muted);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.nav button.on{color:#fff;}
.nav button .ic{font-size:20px;opacity:0.6;transition:0.2s;}
.nav button.on .ic{opacity:1;transform:translateY(-2px);}
.nbadge{background:var(--accent);color:#000;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:900;margin-left:4px;display:inline-block;}

/* ===== REVIEWS ===== */
.rev-card{padding:18px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:20px;margin:0 16px 12px;}
.rev-top{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;}
.rev-stars{color:#ffb800;font-size:10px;margin-top:6px;}

.bg-watermark{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-10deg);font-size:18vw;font-weight:900;color:rgba(255,255,255,0.015);z-index:-1;text-transform:uppercase;pointer-events:none;user-select:none;}
</style>
</head>
<body>
<div id='splash' class='splash'><div class='splash-logo'>O</div></div>
<div class='bg-watermark'>Oncedshop</div>
<div id='app'>
  <div class='topbar'>
    <div class='brand'><div class='logo-sm'>O</div><div><div style='font-weight:800'>Oncedshop</div><div style='font-size:10px;color:var(--text-muted)'>Digital Store</div></div></div>
    <div style='display:flex;gap:8px'>
      <div class='pill-group'><div class='pill-mover' id='curMover'></div><button data-cur='USD'>$</button><button data-cur='RUB'>₽</button></div>
      <div class='pill-group'><div class='pill-mover' id='langMover'></div><button data-lang='ru'>RU</button><button data-lang='en'>EN</button></div>
    </div>
  </div>
  <div id='view'></div>
</div>
<div class='nav' id='nav-bar'>
  <button id='nav-catalog' data-tab='catalog'><span class='ic'>🛍️</span><span>Каталог</span></button>
  <button id='nav-reviews' data-tab='reviews'><span class='ic'>💬</span><span>Отзывы</span></button>
  <button id='nav-cart' data-tab='cart'><span class='ic'>❤️</span><span>Корзина<span id='cartBadge' style='display:none' class='nbadge'>0</span></span></button>
  <button id='nav-cabinet' data-tab='cabinet'><span class='ic'>👤</span><span>Профиль</span></button>
</div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
const CATALOG = [
  {id:'stars',emoji:'⭐',title:{ru:'Telegram Stars',en:'Stars'},items:[{id:'p_stars_1k',title:{ru:'Stars 1000',en:'Stars 1000'},img:'https://img.icons8.com/color/96/telegram-app.png',base:12,unit:'Stars'}]},
  {id:'tiktok',emoji:'📱',title:{ru:'TikTok',en:'TikTok'},items:[{id:'p_tt_coins',title:{ru:'TikTok Монеты',en:'TikTok Coins'},img:'https://img.icons8.com/color/96/tiktok.png',base:0.0105,unit:'шт',kind:'perUnit',note:{ru:'Вход на аккаунт. 1.05р за 1 шт.',en:'Account login. 1.05 RUB per pc.'}}]},
  {id:'rbx',emoji:'🟩',title:{ru:'Roblox',en:'Roblox'},items:[
    {id:'p_rbx_acc',title:{ru:'Robux Account',en:'Robux Account'},img:'https://img.icons8.com/color/96/roblox.png',base:0.0034,unit:'R$',kind:'perUnit',note:{ru:'$3.4 - 1000 R$ (Аккаунт). Выдача 5 дней.',en:'$3.4 - 1000 R$ (Account). 5 days delivery.'}},
    {id:'p_rbxgp_new',title:{ru:'Robux GP',en:'Robux GP'},img:'https://img.icons8.com/color/96/roblox.png',base:0.0036,unit:'R$',kind:'perUnit',note:{ru:'$3.6 - 1000 рб (геймпасс). Выдача 5 дней.',en:'$3.6 - 1000 rb (GP). 5 days delivery.'}},
    {id:'p_rbxpv_new',title:{ru:'Robux Private',en:'Robux Private'},img:'https://img.icons8.com/color/96/roblox-studio.png',base:0.003,unit:'R$',kind:'perUnit',note:{ru:'$3 - 1000 рб (приватный сервер). 5 дней.',en:'$3 - 1000 rb (PV). 5 days delivery.'}}
  ]},
  {id:'brawl',emoji:'🎮',title:{ru:'Brawl Stars',en:'Brawl Stars'},items:[
    {id:'p_brawl_pass',title:{ru:'Brawl Pass',en:'Brawl Pass'},img:'https://sc04.alicdn.com/kf/A7f0cb151d8bf4cbfa877468e1d106cf9t.jpg',base:3.15,unit:'акк'},
    {id:'p_brawl_plus_new',title:{ru:'Brawl Pass Plus',en:'Brawl Pass Plus'},img:'https://sc04.alicdn.com/kf/A7f0cb151d8bf4cbfa877468e1d106cf9t.jpg',base:3.68,unit:'акк'}
  ]},
  {id:'ai',emoji:'🤖',title:{ru:'AI Подписки',en:'AI Subs'},items:[
    {id:'p_gpt_p',title:{ru:'ChatGPT Plus (Личный)',en:'ChatGPT Plus'},img:'https://img.icons8.com/color/96/chatgpt.png',base:1.89,unit:'мес',note:{ru:'180р. Личный акк, гарантия.',en:'180 RUB. Personal, warranty.'}},
    {id:'p_gpt_acc',title:{ru:'ChatGPT Plus (Аккаунт)',en:'ChatGPT Plus'},img:'https://img.icons8.com/color/96/chatgpt.png',base:3.16,unit:'мес',note:{ru:'300р. Гарантия на весь срок.',en:'300 RUB. Full warranty.'}},
    {id:'p_gem_g',title:{ru:'Gemini 18м (Гарантия)',en:'Gemini 18m'},img:'https://img.icons8.com/color/96/google-logo.png',base:1.05,unit:'акк',note:{ru:'100р. Гарантия на весь срок.',en:'100 RUB. Full warranty.'}},
    {id:'p_gem_ng',title:{ru:'Gemini 18м (Без гар.)',en:'Gemini 18m'},img:'https://img.icons8.com/color/96/google-logo.png',base:0.37,unit:'акк',note:{ru:'35р. Без гарантии.',en:'35 RUB. No warranty.'}},
    {id:'p_grok_g',title:{ru:'Super Grok (Гарантия)',en:'Super Grok'},img:'https://img.icons8.com/color/96/x.png',base:3.16,unit:'мес',note:{ru:'300р. Гарантия на весь срок.',en:'300 RUB. Full warranty.'}},
    {id:'p_grok_ng',title:{ru:'Super Grok (Без гар.)',en:'Super Grok'},img:'https://img.icons8.com/color/96/x.png',base:2.11,unit:'мес',note:{ru:'200р. Без гарантии.',en:'200 RUB. No warranty.'}},
    {id:'p_cld_30_ng',title:{ru:'Claude PRO 30д (Без гар.)',en:'Claude PRO 30d'},img:'https://img.icons8.com/color/96/brain.png',base:3.16,unit:'мес',note:{ru:'300р. Без гарантии.',en:'300 RUB. No warranty.'}},
    {id:'p_cld_365_ng',title:{ru:'Claude PRO 365д (Без гар.)',en:'Claude PRO 365d'},img:'https://img.icons8.com/color/96/brain.png',base:15.79,unit:'год',note:{ru:'1500р. Без гарантии.',en:'1500 RUB. No warranty.'}},
    {id:'p_cld_30_g',title:{ru:'Claude PRO 30д (Гарантия)',en:'Claude PRO 30d'},img:'https://img.icons8.com/color/96/brain.png',base:10.53,unit:'мес',note:{ru:'1000р. Способ, с гарантией.',en:'1000 RUB. Method, warranty.'}}
  ]},
  {id:'virta',emoji:'💰',title:{ru:'Вирты',en:'Virts'},items:[
    {id:'p_rad',title:{ru:'Radmir RP',en:'Radmir'},img:'https://sc04.alicdn.com/kf/A9212c3b0f6d44b9c90de0a8d54f2ad4cx.jpg',base:0.55,unit:'1kk'},
    {id:'p_ama',title:{ru:'Amazing RP',en:'Amazing'},img:'https://sc04.alicdn.com/kf/A73993f3356a7447187b73f4b8b4fea8dP.jpg',base:0.47,unit:'1kk'},
    {id:'p_br',title:{ru:'Black Russia',en:'Black Russia'},img:'https://sc04.alicdn.com/kf/A0e637ec6d6f141e39e483a5fc88d325bH.jpg',base:0.37,unit:'1kk'},
    {id:'p_maj',title:{ru:'Majestic RP',en:'Majestic'},img:'https://sc04.alicdn.com/kf/A6fab1941243d4afaa1f1641cd9e3f6cfk.jpg',base:3.16,unit:'1kk'},
    {id:'p_arz',title:{ru:'Arizona RP',en:'Arizona'},img:'https://sc04.alicdn.com/kf/A356ac4bfea8f4fbe902d356556a27f210.jpg',base:2.63,unit:'1kkk'}
  ]}
];
let state = {tab:'catalog', lang:'ru', currency:'USD', rate:95, cart:[], cat:'all'};

function getProduct(pid){
  for(let c of CATALOG) for(let p of c.items) if(p.id===pid) return p;
  return null;
}

function render(){
  document.getElementById('curMover').style.transform = state.currency==='RUB'?'translateX(40px)':'translateX(0)';
  document.getElementById('langMover').style.transform = state.lang==='en'?'translateX(40px)':'translateX(0)';
  const v = document.getElementById('view');
  
  if(state.tab==='catalog'){
    let h = `<div class="chips" id="chipsScroll"><div class="chip ${state.cat==='all'?'on':''}" data-cat="all">Все</div>`;
    CATALOG.forEach(c => h += `<div class="chip ${state.cat===c.id?'on':''}" data-cat="${c.id}">${c.emoji} ${c.title[state.lang]}</div>`);
    h += `</div><div class="hero"><div class="bh-container"><div class="bh-ring"></div><div class="bh-ring"></div><div class="bh-core"></div></div><h1>ONCEDSHOP</h1><div style="font-size:14px;color:rgba(255,255,255,0.6);margin-top:8px;position:relative;z-index:10">Лучшие цены и мгновенная выдача</div></div>`;
    (state.cat==='all'?CATALOG:CATALOG.filter(c=>c.id===state.cat)).forEach(c => c.items.forEach(p => {
      let displayBase = p.base;
      let displayUnit = p.unit;
      if(p.kind==='perUnit' && p.base < 0.1) {
        displayBase = p.base * 1000;
        displayUnit = '1000 ' + p.unit;
      }
      const pr = state.currency==='USD' ? ('$'+(displayBase*1.12).toFixed(2)) : (Math.round(displayBase*1.12*state.rate).toLocaleString()+' ₽');
      h += `<div class="card"><div class="pic"><img src="${p.img}"></div><div class="pinfo"><div class="t">${p.title[state.lang]}</div><div class="n">${p.note?p.note[state.lang]:''}</div><div class="pr">${pr} <small>/ ${displayUnit}</small></div></div><button class="add-btn" data-add="${p.id}">+</button></div>`;
    }));
    v.innerHTML = h;
    setupDragScroll('chipsScroll');
  } else if(state.tab==='cart'){
    if(state.cart.length === 0){
      v.innerHTML = '<div style="padding:60px;text-align:center;color:var(--text-muted)">🛒 Корзина пуста</div>';
    } else {
      let h = '<div style="padding:20px"><h2>Корзина</h2>';
      let total = 0;
      state.cart.forEach((item, idx) => {
        const p = getProduct(item.id);
        if(!p) return;
        let displayBase = p.base;
        if(p.kind==='perUnit' && p.base < 0.1) displayBase = p.base * 1000;
        const priceNum = displayBase * 1.12;
        total += priceNum;
        const pr = state.currency==='USD' ? ('$'+priceNum.toFixed(2)) : (Math.round(priceNum*state.rate).toLocaleString()+' ₽');
        h += `<div class="card" style="margin:0 0 12px 0"><div class="pic"><img src="${p.img}"></div><div class="pinfo"><div class="t">${p.title[state.lang]}</div><div class="pr">${pr}</div></div><button class="add-btn" style="background:rgba(255,0,0,0.1);color:#ff4444;font-size:18px" data-rem="${idx}">×</button></div>`;
      });
      const totalStr = state.currency==='USD' ? ('$'+total.toFixed(2)) : (Math.round(total*state.rate).toLocaleString()+' ₽');
      h += `<div style="padding:16px;background:rgba(255,255,255,0.05);border-radius:20px;margin-top:10px;display:flex;justify-content:space-between;align-items:center"><b>Итого:</b><b style="font-size:20px;color:var(--accent)">${totalStr}</b></div>`;
      h += `<button class="add-btn" style="width:100%;margin-top:20px;background:#fff;color:#000;font-weight:900" id="checkoutBtn">Оформить заказ</button></div>`;
      v.innerHTML = h;
    }
  } else if(state.tab==='reviews'){
    const revs = [
      {u:'Vaugham', t:'Лучший шоп! Все пришло быстро.', s:5},
      {u:'Feryl', t:'Majestic RP вирты получил через 10 минут. Рекомендую!', s:5},
      {u:'Mandr', t:'Цены на робуксы просто огонь.', s:5},
      {u:'Cotyl', t:'Были задержки с AI подпиской, но поддержка помогла.', s:4},
      {u:'Relitha', t:'Gemini 18m работает без нареканий.', s:5}
    ];
    let h = '<div style="padding:20px"><h2>Отзывы</h2>';
    revs.forEach(r => {
      h += `<div class="rev-card"><b>${r.u}</b><div class="rev-stars">${'⭐'.repeat(r.s)}</div><p style="margin:8px 0 0;font-size:14px">${r.t}</p></div>`;
    });
    h += '</div>';
    v.innerHTML = h;
  } else {
    v.innerHTML = '<div style="padding:20px"><h2>Профиль</h2><div class="tile">👤 Guest</div><div class="tile" style="margin-top:12px;opacity:0.6">ID: 000000</div><div style="margin-top:40px;padding:20px;background:rgba(255,255,255,0.05);border-radius:20px;text-align:center">Способ оплаты: Crypto Pay</div></div>';
  }
  
  document.getElementById('cartBadge').innerText = state.cart.length;
  document.getElementById('cartBadge').style.display = state.cart.length > 0 ? 'inline-block' : 'none';

  ['catalog','reviews','cart','cabinet'].forEach(t => {
    const b = document.getElementById('nav-'+(t==='cabinet'?'cabinet':t==='reviews'?'reviews':t==='cart'?'cart':'catalog'));
    if(b) b.className = state.tab===t?'on':'';
  });
}

function setupDragScroll(id){
  const el = document.getElementById(id);
  if(!el) return;
  let isDown = false, startX, scrollLeft;
  el.addEventListener('mousedown', e => { isDown=true; el.classList.add('active'); startX=e.pageX-el.offsetLeft; scrollLeft=el.scrollLeft; });
  el.addEventListener('mouseleave', () => { isDown=false; el.classList.remove('active'); });
  el.addEventListener('mouseup', () => { isDown=false; el.classList.remove('active'); });
  el.addEventListener('mousemove', e => { if(!isDown) return; e.preventDefault(); const x=e.pageX-el.offsetLeft; const walk=(x-startX)*2; el.scrollLeft=scrollLeft-walk; });
}

function init(){
  if(tg){tg.ready();tg.expand();tg.setHeaderColor('#000000');}
  render();
  setTimeout(() => { document.getElementById('splash').classList.add('hide'); document.getElementById('app').classList.add('show'); }, 1200);
}
document.addEventListener('click', e => {
  const d = e.target.closest('[data-tab],[data-lang],[data-cur],[data-cat],[data-add],[data-rem]')?.dataset;
  if(!d) {
    if(e.target.id === 'checkoutBtn') {
      if(tg) tg.sendData(JSON.stringify({action:'checkout', cart:state.cart, currency:state.currency}));
      else alert('Заказ оформлен (тестовый режим)');
    }
    return;
  }
  if(d.tab){ state.tab=d.tab; render(); window.scrollTo(0,0); }
  if(d.lang){ state.lang=d.lang; render(); }
  if(d.cur){ state.currency=d.cur; render(); }
  if(d.cat){ state.cat=d.cat; render(); }
  if(d.add){
    state.cart.push({id:d.add, q:1});
    if(tg) tg.HapticFeedback.impactOccurred('medium');
    render();
  }
  if(d.rem !== undefined){
    state.cart.splice(parseInt(d.rem), 1);
    if(tg) tg.HapticFeedback.impactOccurred('light');
    render();
  }
  if(tg && !d.add && d.rem===undefined) tg.HapticFeedback.impactOccurred('light');
});
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
