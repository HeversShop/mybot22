<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'/>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'/>
<title>Oncedshop</title>
<script src='https://telegram.org/js/telegram-web-app.js'></script>
<style>
:root{
  --bg: #000000; --accent: #ffffff; --text: #ffffff;
  --gold: #f5c518; --gold-dim: rgba(245,197,24,0.18);
  --text-secondary: rgba(255, 255, 255, 0.7);
  --text-muted: rgba(255, 255, 255, 0.45);
  --border: rgba(255, 255, 255, 0.09);
  --border-bright: rgba(255, 255, 255, 0.2);
  --radius-pill: 99px; --radius-lg: 28px; --radius-md: 20px; --radius-sm: 14px;
  --font-main: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;user-select:none;}
html,body{margin:0;padding:0;min-height:100dvh;background:#000;color-scheme:dark;overflow-x:hidden;touch-action:pan-y;}
body{font-family:var(--font-main);color:var(--text);display:flex;justify-content:center;-webkit-font-smoothing:antialiased;}

/* ===== BLACK HOLE CANVAS (full-screen background layer) ===== */
#bhCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

/* ===== CHIPS ===== */
.chips{display:flex;gap:8px;padding:4px 16px 12px;overflow-x:auto;scrollbar-width:none;cursor:grab;}
.chips::-webkit-scrollbar{display:none;}
.chips:active{cursor:grabbing;}
.chip{padding:10px 18px;background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:var(--radius-pill);font-size:13px;font-weight:700;white-space:nowrap;transition:background 0.25s,border-color 0.25s,transform 0.15s;}
.chip:active{transform:scale(0.93);}
.chip.on{background:#fff;color:#000;border-color:#fff;}

#app{position:relative;z-index:1;width:100%;max-width:500px;min-height:100dvh;padding-bottom:140px;opacity:0;transition:opacity 0.7s ease;}
#app.show{opacity:1;}

/* ===== SPLASH ===== */
.splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity 0.6s,visibility 0.6s;}
.splash.hide{opacity:0;visibility:hidden;}
.splash-logo{width:88px;height:88px;border-radius:26px;background:#fff;color:#000;font-size:46px;font-weight:900;display:grid;place-items:center;animation:logoPulse 1.6s infinite alternate ease-in-out;}
@keyframes logoPulse{from{transform:scale(1);}to{transform:scale(1.12);box-shadow:0 0 40px rgba(255,255,255,0.3);}}

/* ===== TOPBAR ===== */
@keyframes pulse{from{opacity:0.2;}to{opacity:0.9;}}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:rgba(0,0,0,0.75);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:12px;}
.logo-sm{width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;color:#000;}
.pill-group{display:flex;background:rgba(255,255,255,0.1);border-radius:var(--radius-pill);padding:2px;position:relative;border:1px solid var(--border);width:84px;height:32px;margin-left:8px;}
.pill-group button{all:unset;flex:1;height:100%;font-size:11px;font-weight:800;color:var(--text-muted);cursor:pointer;z-index:2;position:relative;text-align:center;}
.pill-group button.on{color:#000;}
.pill-mover{position:absolute;top:2px;bottom:2px;width:40px;background:#fff;border-radius:var(--radius-pill);transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);z-index:1;pointer-events:none;}

/* ===== HERO (mini black-hole scene in header card) ===== */
.hero{margin:16px;padding:52px 24px 40px;border-radius:var(--radius-lg);background:rgba(0,0,0,0.6);border:1px solid var(--border);position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,0.04) 0%,transparent 70%);pointer-events:none;}
.hero h1{margin:0;font-size:36px;font-weight:900;letter-spacing:-2px;position:relative;z-index:10;color:#fff;text-shadow:0 0 40px rgba(0,0,0,1);}
.hero-sub{font-size:14px;color:rgba(255,255,255,0.55);margin-top:8px;position:relative;z-index:10;}

/* ===== CARDS — transparent, glassmorphism ===== */
.card{
  display:flex;align-items:center;gap:16px;
  padding:18px;border-radius:var(--radius-md);
  margin:0 16px 12px;
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);
  transition:border-color 0.3s,background 0.3s,transform 0.25s;
  animation:cardIn 0.5s ease backwards;
  will-change:transform,opacity;
}
.card:hover{border-color:rgba(255,255,255,0.18);background:rgba(255,255,255,0.07);}
.card.adding{transform:scale(1.025);border-color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.09);}
@keyframes cardIn{
  from{opacity:0;transform:translateY(18px) scale(0.97);}
  to{opacity:1;transform:translateY(0) scale(1);}
}

/* picture cell — transparent bg, no white box */
.pic{width:82px;height:82px;flex:0 0 82px;border-radius:20px;background:transparent;border:1px solid var(--border);display:grid;place-items:center;overflow:hidden;position:relative;}
.pic img{width:80%;height:80%;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.7));}

.pinfo{flex:1;min-width:0;}
.pinfo .t{font-size:16px;font-weight:800;letter-spacing:-0.3px;}
.pinfo .n{font-size:11px;color:var(--text-secondary);line-height:1.4;margin-top:4px;font-weight:500;}
.pinfo .pr{font-size:17px;font-weight:900;margin-top:6px;color:var(--accent);}
/* gold price line */
.pinfo .gold-pr{font-size:12px;font-weight:700;color:var(--gold);margin-top:2px;display:flex;align-items:center;gap:4px;}
.pinfo .gold-pr::before{content:'🪙';}

.add-btn{all:unset;width:48px;height:48px;border-radius:16px;background:#fff;color:#000;display:grid;place-items:center;font-size:26px;font-weight:300;cursor:pointer;margin-left:auto;transition:transform 0.2s cubic-bezier(0.4,0,0.2,1),background 0.2s;flex-shrink:0;}
.add-btn:active{transform:scale(0.82);}
.add-btn.added-anim{background:#00ff88!important;color:#000!important;transform:scale(1.12);}

/* ===== NAV ===== */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:calc(100% - 32px);max-width:440px;z-index:100;display:flex;padding:10px;background:rgba(18,18,18,0.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,0.13);border-radius:var(--radius-lg);box-shadow:0 18px 50px rgba(0,0,0,0.65);}
.nav button{all:unset;flex:1;text-align:center;padding:8px 0;color:var(--text-muted);font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:color 0.2s;-webkit-tap-highlight-color:transparent;}
.nav button.on{color:#fff;}
.nav button .ic{font-size:22px;opacity:0.5;transition:opacity 0.2s,transform 0.3s cubic-bezier(0.34,1.56,0.64,1);display:block;}
.nav button.on .ic{opacity:1;transform:translateY(-4px) scale(1.15);}
.nbadge{background:var(--accent);color:#000;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:900;position:absolute;top:-5px;right:calc(50% - 20px);border:2px solid #121212;}

/* ===== REVIEWS ===== */
.rev-card{padding:20px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius-md);margin:0 16px 16px;animation:revIn 0.5s cubic-bezier(0.2,0.8,0.2,1) backwards;}
@keyframes revIn{from{opacity:0;transform:translateY(22px) scale(0.95);}to{opacity:1;transform:translateY(0) scale(1);}}
.rev-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.rev-avatar{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.1);display:grid;place-items:center;font-weight:900;font-size:14px;color:var(--accent);border:1px solid var(--border);}
.rev-stars{color:#ffb800;font-size:12px;margin-top:2px;}

/* ===== CABINET & PROFILE ===== */
.user-card{padding:24px;background:linear-gradient(135deg,rgba(255,255,255,0.06) 0%,rgba(255,255,255,0.01) 100%);border:1px solid var(--border-bright);border-radius:var(--radius-lg);margin-bottom:24px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.35);}
.user-card::after{content:'';position:absolute;top:-50px;right:-50px;width:120px;height:120px;background:var(--accent);filter:blur(80px);opacity:0.15;pointer-events:none;}
.user-avatar-lg{width:64px;height:64px;border-radius:22px;background:#fff;color:#000;display:grid;place-items:center;font-size:32px;font-weight:900;margin-bottom:16px;box-shadow:0 8px 20px rgba(255,255,255,0.2);}
.user-name-big{font-size:22px;font-weight:900;letter-spacing:-0.5px;}
.user-status-tag{display:inline-block;padding:4px 10px;background:rgba(255,255,255,0.1);border-radius:8px;font-size:10px;font-weight:800;margin-top:8px;color:var(--text-secondary);text-transform:uppercase;}
.tile{padding:18px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius-md);display:flex;align-items:center;gap:16px;margin-bottom:12px;transition:0.3s;}
.tile.active{border-color:var(--accent);background:rgba(255,255,255,0.07);box-shadow:0 0 25px rgba(255,255,255,0.04);}
.tile .icon{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,0.06);display:grid;place-items:center;font-size:24px;border:1px solid var(--border);transition:0.3s;}
.tile.active .icon{background:#fff;color:#000;transform:scale(1.05);}
.tile .info{flex:1;}
.tile .label{font-size:11px;color:var(--text-muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:0.5px;}
.tile .value{font-size:16px;font-weight:800;}
.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;}
.pay-item{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:20px;padding:18px 8px;text-align:center;transition:0.3s;}
.pay-item:hover{background:rgba(255,255,255,0.07);transform:translateY(-3px);}
.pay-item img{width:32px;height:32px;margin-bottom:8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5));}
.pay-item .name{font-size:12px;font-weight:800;color:var(--text-secondary);}
.status-pill{font-size:9px;font-weight:900;padding:4px 8px;border-radius:8px;background:var(--accent);color:#000;text-transform:uppercase;margin-left:auto;box-shadow:0 0 10px rgba(255,255,255,0.3);}
.pay-selector{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0;}
.pay-opt{padding:14px 8px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:16px;text-align:center;font-size:12px;font-weight:700;transition:0.2s;cursor:pointer;white-space:nowrap;}
.pay-opt.on{background:#fff;color:#000;border-color:#fff;}
.rev-form{padding:20px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:20px;}
.rev-stars-select{display:flex;gap:8px;margin-bottom:16px;font-size:24px;cursor:pointer;}
.rev-stars-select span{opacity:0.3;transition:0.2s;}
.rev-stars-select span.on{opacity:1;filter:drop-shadow(0 0 5px rgba(255,184,0,0.5));}
.rev-input{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;padding:12px;color:#fff;font-family:inherit;margin-bottom:12px;resize:none;}
.rev-submit{width:100%;height:44px;background:var(--accent);color:#000;border-radius:12px;font-weight:800;border:none;cursor:pointer;}

/* ===== FLYING ITEM ===== */
.flying-item{position:fixed;z-index:1000;pointer-events:none;transition:all 0.75s cubic-bezier(0.4,0,0.2,1);border-radius:12px;overflow:hidden;}

/* ===== ABOUT PAGE ===== */
.about-box{padding:20px;}
.about-card{padding:24px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:20px;}
.about-card h3{margin:0 0 12px;color:var(--accent);}
.about-card p{margin:0;font-size:14px;line-height:1.6;color:var(--text-secondary);}

.btn-primary{display:block;width:100%;height:50px;background:var(--accent);color:#000;border-radius:var(--radius-md);font-weight:800;font-size:15px;border:none;cursor:pointer;margin-top:20px;transition:opacity 0.2s,transform 0.15s;}
.btn-primary:active{transform:scale(0.97);}
.btn-primary.loading{opacity:0.7;pointer-events:none;position:relative;color:transparent!important;}
.btn-primary.loading::after{content:'';position:absolute;width:20px;height:20px;top:calc(50% - 10px);left:calc(50% - 10px);border:3px solid rgba(0,0,0,0.15);border-top-color:#000;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.error-msg{background:rgba(255,68,68,0.1);border:1px solid rgba(255,68,68,0.2);color:#ff4444;padding:12px;border-radius:12px;font-size:13px;margin-top:12px;text-align:center;display:none;animation:shake 0.4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.qty-input{width:60px;height:36px;background:rgba(255,255,255,0.1);border:1px solid var(--border);border-radius:10px;color:#fff;text-align:center;font-weight:800;font-family:inherit;margin-right:8px;}
.qty-input:focus{border-color:var(--accent);}
.bg-watermark{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-10deg);font-size:18vw;font-weight:900;color:rgba(255,255,255,0.012);z-index:0;text-transform:uppercase;pointer-events:none;}

/* ===== GOLD BADGE on card ===== */
.gold-badge{display:inline-flex;align-items:center;gap:4px;background:var(--gold-dim);border:1px solid rgba(245,197,24,0.35);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800;color:var(--gold);margin-top:4px;}
</style>
</head>
<body>
<canvas id='bhCanvas'></canvas>
<div id='splash' class='splash'><div class='splash-logo'>O</div></div>
<div class='bg-watermark'>Oncedshop</div>
<div id='app'>
  <div class='topbar'>
    <div class='brand'><div class='logo-sm'>O</div><div><div style='font-weight:800'>Oncedshop</div><div style='font-size:10px;color:var(--text-muted)'>Digital Store</div></div></div>
    <div style='display:flex;gap:8px;align-items:center'>
      <div id="rateStatus" style="font-size:10px;color:var(--accent);opacity:0.6;display:none;margin-right:-4px;animation:pulse 1s infinite alternate">●</div>
      <div class='pill-group'><div class='pill-mover' id='curMover'></div><button type="button" data-cur='USD'>$</button><button type="button" data-cur='RUB'>₽</button></div>
      <div class='pill-group'><div class='pill-mover' id='langMover'></div><button type="button" data-lang='ru'>RU</button><button type="button" data-lang='en'>EN</button></div>
    </div>
  </div>
  <div id='view'></div>
</div>
<div class='nav' id='nav-bar'>
  <button id='nav-catalog' data-tab='catalog'><span class='ic'>⚡</span><span>Магазин</span></button>
  <button id='nav-cart' data-tab='cart' style='position:relative'><span class='ic'>🛍️</span><span>Корзина</span><span id='cartBadge' style='display:none' class='nbadge'>0</span></button>
  <button id='nav-reviews' data-tab='reviews'><span class='ic'>💬</span><span>Отзывы</span></button>
  <button id='nav-cabinet' data-tab='cabinet'><span class='ic'>👤</span><span>Профиль</span></button>
  <button id='nav-about' data-tab='about'><span class='ic'>ℹ️</span><span>О нас</span></button>
</div>

<script>
/* ===================== BLACK HOLE CANVAS ===================== */
(function(){
  const canvas = document.getElementById('bhCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, cx, cy, raf;
  const PARTICLES = [];
  const N_DISK = 260;   // accretion disk particles
  const N_STARS = 140;  // background field stars
  const BH_R = 48;      // event horizon radius (px, base)

  function resize(){
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2; cy = H / 2;
  }

  function randRange(a,b){ return a + Math.random()*(b-a); }

  function initParticles(){
    PARTICLES.length = 0;
    // Accretion disk — flat ellipse of glowing particles
    for(let i=0;i<N_DISK;i++){
      const angle = Math.random() * Math.PI * 2;
      const dist  = randRange(BH_R*1.3, BH_R*4.8);
      const speed = (0.18 + Math.random()*0.32) * (Math.random()<0.5?1:-1);
      const hue   = Math.random()<0.55 ? randRange(15,45) : randRange(180,220); // orange/cyan
      const size  = randRange(0.6, 2.2);
      const alpha = randRange(0.35, 0.95);
      PARTICLES.push({type:'disk', angle, dist, speed, hue, size, alpha, phi: randRange(-0.18,0.18)});
    }
    // Background stars — very slow drift
    for(let i=0;i<N_STARS;i++){
      PARTICLES.push({
        type:'star',
        x: Math.random()*W, y: Math.random()*H,
        r: randRange(0.3,1.2),
        alpha: randRange(0.1,0.6),
        twinkleSpeed: randRange(0.005,0.025),
        twinklePhase: Math.random()*Math.PI*2,
      });
    }
  }

  function drawFrame(t){
    ctx.clearRect(0,0,W,H);

    // Soft gravitational lens glow behind the hole
    const grd = ctx.createRadialGradient(cx,cy,BH_R*0.5, cx,cy,BH_R*6);
    grd.addColorStop(0,'rgba(0,0,0,0)');
    grd.addColorStop(0.4,'rgba(10,5,20,0.18)');
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,W,H);

    // Stars
    for(const p of PARTICLES){
      if(p.type!=='star') continue;
      const a = p.alpha * (0.5 + 0.5*Math.sin(t*p.twinkleSpeed + p.twinklePhase));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fill();
    }

    // Accretion disk
    for(const p of PARTICLES){
      if(p.type!=='disk') continue;
      p.angle += p.speed * 0.016;
      // Gravitational lensing: compress to thin ellipse
      const ex = cx + p.dist * Math.cos(p.angle);
      const ey = cy + p.dist * Math.sin(p.angle) * 0.22 + p.dist * Math.sin(p.phi) * 0.35;
      // Doppler shift: brighten on approach side
      const brightness = p.speed > 0
        ? 40 + 80 * Math.max(0, Math.cos(p.angle))
        : 40 + 80 * Math.max(0, -Math.cos(p.angle));
      // Fade out particles too close to event horizon
      const dToCenter = Math.hypot(ex-cx, ey-cy);
      let alpha = p.alpha * Math.min(1, (dToCenter - BH_R) / (BH_R*0.5));
      if(alpha<=0) continue;
      ctx.beginPath();
      ctx.arc(ex, ey, p.size, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue},90%,${brightness}%,${alpha})`;
      ctx.shadowBlur = p.size * 4;
      ctx.shadowColor = `hsla(${p.hue},100%,70%,${alpha*0.6})`;
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Event horizon — pure black disk
    ctx.beginPath();
    ctx.arc(cx, cy, BH_R, 0, Math.PI*2);
    ctx.fillStyle = '#000';
    ctx.fill();

    // Photon sphere / gravitational ring
    const pgrd = ctx.createRadialGradient(cx,cy,BH_R*0.9, cx,cy,BH_R*1.45);
    pgrd.addColorStop(0,'rgba(255,220,120,0.22)');
    pgrd.addColorStop(0.5,'rgba(255,160,60,0.10)');
    pgrd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, BH_R*1.45, 0, Math.PI*2);
    ctx.fillStyle = pgrd;
    ctx.fill();

    // Lens shimmer at edge
    ctx.beginPath();
    ctx.arc(cx, cy, BH_R+1, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,200,100,0.18)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    raf = requestAnimationFrame(drawFrame);
  }

  window.addEventListener('resize', ()=>{ resize(); initParticles(); });
  resize();
  initParticles();
  raf = requestAnimationFrame(drawFrame);
})();

/* ===================== SHOP LOGIC ===================== */
const API_BASE='';
const tg = window.Telegram ? window.Telegram.WebApp : null;
const GOLD_PER_RUB = 0.29;

const CATALOG = [
  {id:'stars',emoji:'⭐',title:{ru:'Telegram Stars',en:'Stars'},items:[
    {id:'p_stars_1k',title:{ru:'Stars 1000',en:'Stars 1000'},img:'https://img.icons8.com/color/96/telegram-app.png',base:12,unit:'Stars'}
  ]},
  {id:'tiktok',emoji:'📱',title:{ru:'TikTok',en:'TikTok'},items:[
    {id:'p_tt_coins',title:{ru:'TikTok Монеты',en:'TikTok Coins'},img:'https://img.icons8.com/color/96/tiktok.png',base:0.01176,unit:'шт',kind:'perUnit',note:{ru:'Вход на аккаунт.',en:'Account login.'}}

function getProduct(pid){
  for(let c of CATALOG) for(let p of c.items) if(p.id===pid) return p;
  return null;
}

function fmtGold(rub){
  return Math.round(rub / GOLD_PER_RUB).toLocaleString();
}

function buildPriceHTML(displayBase){
  const rawUSD   = displayBase * 1.12;
  const roundUSD = (Math.ceil(rawUSD * 20) / 20).toFixed(2);
  if(state.currency === 'USD'){
    const rubApprox = Math.round(rawUSD * state.rate);
    const gold      = fmtGold(rubApprox);
    return `$${roundUSD} <span class="gold-badge">${gold} Gold</span>`;
  } else {
    const rub  = Math.round(displayBase * 1.12 * state.rate);
    const gold = fmtGold(rub);
    return `${rub.toLocaleString()} ₽ <span class="gold-badge">${gold} Gold</span>`;
  }
}

function animateFly(targetEl){
  const card=targetEl.closest('.card');
  const img=card.querySelector('.pic img');
  const cartBtn=document.getElementById('nav-cart');
  if(!img||!cartBtn) return;
  const rect=img.getBoundingClientRect();
  const cartRect=cartBtn.getBoundingClientRect();
  const clone=img.cloneNode(true);
  clone.className='flying-item';
  Object.assign(clone.style,{width:rect.width+'px',height:rect.height+'px',top:rect.top+'px',left:rect.left+'px'});
  document.body.appendChild(clone);
  clone.offsetWidth;
  Object.assign(clone.style,{top:(cartRect.top+cartRect.height/2)+'px',left:(cartRect.left+cartRect.width/2)+'px',width:'18px',height:'18px',opacity:'0',transform:'scale(0.1) rotate(420deg)'});
  setTimeout(()=>{
    clone.remove();
    cartBtn.style.transform='scale(1.22)';
    setTimeout(()=>cartBtn.style.transform='',220);
  },780);
}

function setupDragScroll(id){
  const el=document.getElementById(id); if(!el) return;
  let isDown=false,startX,scrollLeft;
  el.addEventListener('mousedown',e=>{isDown=true;el.classList.add('active');startX=e.pageX-el.offsetLeft;scrollLeft=el.scrollLeft;});
  el.addEventListener('mouseleave',()=>{isDown=false;el.classList.remove('active');});
  el.addEventListener('mouseup',()=>{isDown=false;el.classList.remove('active');});
  el.addEventListener('mousemove',e=>{if(!isDown)return;e.preventDefault();const x=e.pageX-el.offsetLeft;el.scrollLeft=scrollLeft-(x-startX)*2;});
}

async function updateRate(){
  state.rateLoading=true;
  document.getElementById('rateStatus').style.display='block';
  const ctl=new AbortController();
  const tid=setTimeout(()=>ctl.abort(),3500);
  try{
    const res=await fetch('https://api.exchangerate-api.com/v4/latest/USD',{signal:ctl.signal});
    const data=await res.json();
    if(data?.rates?.RUB){state.rate=data.rates.RUB;render();}
  }catch(e){console.log('Rate fetch failed, using fallback');}
  finally{
    clearTimeout(tid);state.rateLoading=false;
    const s=document.getElementById('rateStatus');if(s)s.style.display='none';
  }
}

setTimeout(()=>{

},3500);

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-tab],[data-lang],[data-cur],[data-cat],[data-add],[data-rem],[data-action],[data-pay],[data-revstars]');
  const d=el?.dataset; if(!d) return;
  e.preventDefault();
  if(d.action==='checkout'){
    const btn=el,errEl=document.getElementById('checkoutError');
    if(errEl)errEl.style.display='none';
    btn.classList.add('loading');
    if(tg)tg.HapticFeedback.notificationOccurred('success');
    setTimeout(()=>{
      const payMap={sbp:'СБП',crypto:'USDT/BTC',card:'Карта РФ',market:'Баланс'};
      const orderData={action:'checkout_appeal',payMethod:payMap[state.payMethod]||'Не выбран',currency:state.currency,lang:state.lang,
        total:state.cart.reduce((sum,item)=>{const p=getProduct(item.id);return sum+(p?(p.kind==='perUnit'&&p.base<0.1?p.base*1000:p.base)*1.12:0);},0).toFixed(2),
        items:state.cart.map(item=>({id:item.id,name:getProduct(item.id)?.title[state.lang]}))};
      const initData = tg ? (tg.initData || '') : '';
      // Try server API first (works both in browser and Telegram WebApp)
      if(API_BASE && initData){
        fetch(API_BASE+'/api/order',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({initData, order:orderData})})
          .then(r=>r.json()).then(d=>{
            btn.classList.remove('loading');
            if(d.ok){
              if(tg&&tg.showPopup) tg.showPopup({title:'✅ Заказ принят',message:'Номер: '+d.order_id+'\nМы свяжемся с вами в ближайшее время.',buttons:[{type:'ok'}]});
              else alert('Заказ принят! Номер: '+d.order_id);
              state.cart=[];render();
            } else {
              const errEl=document.getElementById('checkoutError');
              if(errEl){errEl.style.display='block';errEl.textContent='Ошибка: '+(d.error||'server');}
            }
          }).catch(()=>{
            // fallback to sendData
            btn.classList.remove('loading');
            if(tg&&tg.sendData) tg.sendData(JSON.stringify(orderData));
            else alert('Заявка отправлена!');
          });
      } else if(tg&&tg.sendData){
        tg.sendData(JSON.stringify(orderData));btn.classList.remove('loading');
      } else {
        console.log('Order:',orderData);alert('Заявка отправлена (режим браузера)');btn.classList.remove('loading');
      }
    },600);return;
  }
  if(d.action==='toggleRevForm'){state.showRevForm=!state.showRevForm;render();return;}
  if(d.action==='submitRev'){
    if(tg&&tg.showPopup)tg.showPopup({title:'Успешно',message:'Ваш отзыв отправлен на модерацию!',buttons:[{type:'ok'}]});
    else alert('Ваш отзыв отправлен на модерацию!');
    state.showRevForm=false;render();return;
  }
  if(d.revstars){state.revStars=parseInt(d.revstars);render();return;}
  if(d.pay){state.payMethod=d.pay;if(tg)tg.HapticFeedback.impactOccurred('light');render();return;}
  if(d.tab){state.tab=d.tab;render();window.scrollTo(0,0);}
  if(d.lang){state.lang=d.lang;render();}
  if(d.cur){state.currency=d.cur;render();}
  if(d.cat){state.cat=d.cat;render();}
  if(d.add){
    const p=getProduct(d.add);let qty=1;
    if(p&&p.kind==='perUnit'){
      const input=prompt(state.lang==='ru'?'Введите количество:':'Enter quantity:','1');
      qty=parseInt(input);if(isNaN(qty)||qty<=0)return;
    }
    state.cart.push({id:d.add,q:qty});
    if(tg)tg.HapticFeedback.impactOccurred('medium');
    animateFly(el);
    const btn=el,card=el.closest('.card');
    if(btn&&card){
      btn.classList.add('added-anim');card.classList.add('adding');
      setTimeout(()=>{btn.classList.remove('added-anim');card.classList.remove('adding');render();},400);
    }else render();
  }
  if(d.rem!==undefined){state.cart.splice(parseInt(d.rem),1);if(tg)tg.HapticFeedback.impactOccurred('light');render();}
  if(tg&&!d.add&&d.rem===undefined)tg.HapticFeedback.impactOccurred('light');
});
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
