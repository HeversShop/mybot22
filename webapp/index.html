<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'/>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'/>
<title>Oncedshop</title>
<script src='https://telegram.org/js/telegram-web-app.js'></script>
<style>
:root{
  --bg: #000000; --accent: #ffffff; --text: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.7);
  --text-muted: rgba(255, 255, 255, 0.45);
  --border: rgba(255, 255, 255, 0.1);
  --border-bright: rgba(255, 255, 255, 0.2);
  --radius-pill: 99px; --radius-lg: 24px; --radius-md: 18px;
  --font-main: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}
html,body{margin:0;padding:0;min-height:100%;background:#000;color-scheme: dark;}
body{font-family:var(--font-main); color:var(--text); display:flex;justify-content:center; overflow-x:hidden; -webkit-font-smoothing: antialiased;}
#app{width:100%;max-width:500px;min-height:100vh;padding-bottom:140px;opacity:0;transition:opacity 0.6s ease;}
#app.show{opacity:1;}

.splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;transition:0.5s;}
.splash.hide{opacity:0;visibility:hidden;}
.splash-logo{width:80px;height:80px;border-radius:22px;background:#fff;color:#000;font-size:40px;font-weight:900;display:grid;place-items:center;animation:logoPulse 1.5s infinite alternate ease-in-out;}
@keyframes logoPulse{from{transform:scale(1);}to{transform:scale(1.1);box-shadow:0 0 30px rgba(255,255,255,0.2);}}

.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;background:rgba(0,0,0,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:12px;}
.logo-sm{width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;color:#000;}

.pill-group{display:flex;background:rgba(255,255,255,0.08);border-radius:var(--radius-pill);padding:2px;position:relative;border:1px solid var(--border);width:84px;height:32px;}
.pill-group button{all:unset;flex:1;height:100%;font-size:11px;font-weight:800;color:var(--text-muted);cursor:pointer;z-index:2;position:relative;text-align:center;}
.pill-group button.on{color:#000;}
.pill-mover{position:absolute;top:2px;bottom:2px;width:40px;background:#fff;border-radius:var(--radius-pill);transition:transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);z-index:1;pointer-events:none;}

.hero{margin:16px;padding:40px 24px;border-radius:24px;background:rgba(255,255,255,0.03);border:1px solid var(--border);position:relative;overflow:hidden;}
.hero h1{margin:0;font-size:32px;font-weight:900;letter-spacing:-1.5px;position:relative;z-index:5;}
.black-hole {
  position: absolute; right: -40px; top: -10px; width: 180px; height: 180px;
  background: radial-gradient(circle, #000 15%, #111 30%, transparent 65%);
  border-radius: 50%; opacity: 0.5; animation: holeSpin 10s linear infinite;
  z-index: 1; border: 1px solid rgba(255,255,255,0.05);
}
@keyframes holeSpin { from{transform:rotate(0) scale(1);} to{transform:rotate(360deg) scale(1.1);} }
.hero:hover .black-hole { opacity: 1; transform: scale(1.4) rotate(180deg); box-shadow: 0 0 60px 10px rgba(255,255,255,0.05); }

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 20px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;padding:10px 18px;border-radius:14px;font-size:13px;font-weight:700;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;}
.chip.on{background:#fff;color:#000;}

.card{display:flex;align-items:center;gap:16px;padding:16px;border-radius:20px;margin:0 16px 12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);transition:0.2s;animation:cardIn 0.5s ease backwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
.pic{width:56px;height:56px;flex:0 0 56px;border-radius:14px;background:rgba(255,255,255,0.03);display:grid;place-items:center;overflow:hidden;}
.pic img{width:80%;height:80%;object-fit:contain; padding:2px;}

.pinfo{flex:1;min-width:0;}
.pinfo .t{font-size:14px;font-weight:800;margin-bottom:2px;}
.pinfo .n{font-size:10px;color:var(--text-muted);line-height:1.3;margin-top:2px;}
.pinfo .pr{font-size:15px;font-weight:900;margin-top:6px;color:var(--accent);}

.add-btn{all:unset;width:40px;height:40px;border-radius:12px;background:#fff;color:#000;display:grid;place-items:center;font-size:22px;cursor:pointer;margin-left:auto;}

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:calc(100% - 32px);max-width:440px;z-index:100;display:flex;padding:10px;background:rgba(20,20,20,0.85);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:28px;}
.nav button{all:unset;flex:1;text-align:center;padding:8px 0;color:var(--text-muted);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.nav button.on{color:#fff;}
.nav button .ic{font-size:20px;opacity:0.6;}
.nav button.on .ic{opacity:1;transform:translateY(-2px);}

.rev-card{padding:18px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:20px;margin:0 16px 12px;}
.rev-top{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;}
.rev-text{font-size:14px;line-height:1.5;color:var(--text-secondary);}
.rev-stars{color:#ffb800;font-size:10px;margin-top:6px;}

.bg-watermark{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-10deg);font-size:18vw;font-weight:900;color:rgba(255,255,255,0.015);z-index:-1;text-transform:uppercase;pointer-events:none;user-select:none;}
.backdrop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.85);opacity:0;pointer-events:none;transition:0.3s;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px);}
.backdrop.show{opacity:1;pointer-events:auto;}
.sheet{width:100%;max-width:500px;background:#0f0f0f;border-top:1px solid var(--border-bright);border-radius:32px 32px 0 0;padding:24px 24px 40px;transform:translateY(100%);transition:0.4s cubic-bezier(0.4,0,0.2,1);max-height:85vh;overflow-y:auto;}
.backdrop.show .sheet{transform:translateY(0);}
.backdrop.show ~ .nav{transform:translate(-50%,120px);opacity:0;}

.tile{display:flex;align-items:center;gap:14px;padding:18px;background:linear-gradient(135deg,rgba(255,255,255,0.06),rgba(255,255,255,0.01));border:1px solid var(--border);border-radius:18px;margin-bottom:12px;cursor:pointer;}
</style>
</head>
<body>
<div id='splash' class='splash'><div class='splash-logo'>O</div></div>
<div class='bg-watermark'>Oncedshop</div>
<div id='app'>
  <div class='topbar'>
    <div class='brand'><div class='logo-sm'>O</div><div style='font-weight:800'>Oncedshop</div></div>
    <div style='display:flex;gap:8px'>
      <div class='pill-group'><div class='pill-mover' id='curMover'></div><button data-cur='USD'>$</button><button data-cur='RUB'>₽</button></div>
      <div class='pill-group'><div class='pill-mover' id='langMover'></div><button data-lang='ru'>RU</button><button data-lang='en'>EN</button></div>
    </div>
  </div>
  <div id='view'></div>
</div>
<div class='nav'>
  <button id='nav-catalog' data-tab='catalog'><span class='ic'>🛍️</span><span>Каталог</span></button>
  <button id='nav-reviews' data-tab='reviews'><span class='ic'>💬</span><span>Отзывы</span></button>
  <button id='nav-cabinet' data-tab='cabinet'><span class='ic'>👤</span><span>Профиль</span></button>
</div>
<div class='backdrop' id='backdrop' onclick="closeSheet()"><div class='sheet' id='sheet' onclick="event.stopPropagation()"></div></div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
const MARKUP = 0.12;
const CATALOG = [
  {id:'tiktok',emoji:'📱',title:{ru:'TikTok',en:'TikTok'},items:[
    {id:'p_tt_1',title:{ru:'TikTok Монеты',en:'TikTok Coins'},img:'https://img.icons8.com/color/96/tiktok.png',base:0.011,unit:'шт',kind:'perUnit',note:{ru:'Вход на аккаунт. 1.05р за 1 монету.',en:'Account login. 1.05 RUB per coin.'}}
  ]},
  {id:'rbx',emoji:'🟩',title:{ru:'Roblox',en:'Roblox'},items:[
    {id:'p_rbx_gp',title:{ru:'Robux GamePass',en:'Robux GP'},img:'https://img.icons8.com/color/96/roblox.png',base:0.0036,unit:'R$',kind:'perUnit',note:{ru:'5 дней. Комиссия на нас!',en:'5 days. Fee covered!'}},
    {id:'p_rbx_pv',title:{ru:'Robux Private',en:'Robux Private'},img:'https://img.icons8.com/color/96/roblox.png',base:0.003,unit:'R$',kind:'perUnit',note:{ru:'5 дней. Через VIP Server.',en:'5 days. via VIP Server.'}}
  ]},
  {id:'brawl',emoji:'🎮',title:{ru:'Brawl Stars',en:'Brawl Stars'},items:[
    {id:'p_bp_reg',title:{ru:'Brawl Pass',en:'Brawl Pass'},img:'https://img.icons8.com/color/96/supercell.png',base:3.15,unit:'акк',note:{ru:'300р. Код или вход.',en:'300 RUB. Code or login.'}},
    {id:'p_bp_plus',title:{ru:'Brawl Pass Plus',en:'Brawl Pass Plus'},img:'https://img.icons8.com/color/96/supercell.png',base:3.68,unit:'акк',note:{ru:'350р. Код или вход.',en:'350 RUB. Code or login.'}}
  ]},
  {id:'ai',emoji:'🤖',title:{ru:'AI Подписки',en:'AI Subs'},items:[
    {id:'p_gpt_p',title:{ru:'ChatGPT Plus (Личный)',en:'ChatGPT Plus'},img:'https://img.icons8.com/color/96/chatgpt.png',base:1.89,unit:'мес',note:{ru:'180р. Гарантия.',en:'180 RUB. Warranty.'}},
    {id:'p_gem_18',title:{ru:'Gemini 18 мес',en:'Gemini 18m'},img:'https://img.icons8.com/color/96/google-logo.png',base:1.05,unit:'акк',note:{ru:'100р. Гарантия.',en:'100 RUB. Warranty.'}},
    {id:'p_claude_30',title:{ru:'Claude PRO 30д',en:'Claude PRO 30d'},img:'https://img.icons8.com/color/96/brain.png',base:3.15,unit:'мес',note:{ru:'300р. Без гарантии.',en:'300 RUB. No warranty.'}}
  ]},
  {id:'virta',emoji:'💰',title:{ru:'Вирты',en:'Virts'},items:[
    {id:'p_rad',title:{ru:'Radmir RP',en:'Radmir'},img:'https://img.icons8.com/color/96/get-revenue.png',base:0.55,unit:'1kk',kind:'perUnit',note:{ru:'52р/1кк. Мин 25кк.',en:'52r/1m. Min 25m.'}},
    {id:'p_ama',title:{ru:'Amazing RP',en:'Amazing'},img:'https://img.icons8.com/color/96/get-revenue.png',base:0.47,unit:'1kk',kind:'perUnit',note:{ru:'45р/1кк. Мин 25кк.',en:'45r/1m. Min 25m.'}},
    {id:'p_maj',title:{ru:'Majestic RP',en:'Majestic'},img:'https://sun9-24.userapi.com/impf/c850624/v850624383/107f9c/7p5G-QxX_z0.jpg?size=200x200&quality=96&type=album',base:2.11,unit:'1kk',kind:'perUnit',note:{ru:'0.20р/1к. Мин 5.5кк.',en:'0.20r/1k. Min 5.5m.'}},
    {id:'p_arz',title:{ru:'Arizona RP',en:'Arizona'},img:'https://sun9-62.userapi.com/impf/c855224/v855224098/197b10/Vn9mX3R297U.jpg?size=200x200&quality=96&type=album',base:2.63,unit:'1kkk',kind:'perUnit',note:{ru:'0.25р/1кк. Мин 5.7ккк.',en:'0.25r/1m. Min 5.7b.'}}
  ]}
];

const REVIEWS = [
  {u:'Vaugham', d:'Сегодня, 11:15', t:'Взял вирты на Majestic. Курс лучший, выдали в течение дня. Очень доволен!', s:5},
  {u:'Feryl', d:'Вчера, 19:40', t:'1000 Stars пришли мгновенно. Спасибо саппорту за помощь с оплатой.', s:5},
  {u:'Mandr', d:'2 дня назад', t:'Дизайн просто пушка! Особенно черная дыра, залипаю по 5 минут.', s:5},
  {u:'Cotyl', d:'5 дней назад', t:'Arizona пришла, пришлось подождать пару часов, но курс того стоит.', s:4},
  {u:'Wanell', d:'1 неделю назад', t:'Робуксы зашли ровно через день. Без комиссии, как и обещали. Топ!', s:5},
  {u:'Relitha', d:'10 дней назад', t:'Claude PRO работает стабильно. Данные выдали через бота сразу.', s:5},
  {u:'Gunna', d:'2 недели назад', t:'Уже четвертая покупка тут. Ни разу не подвели, цены вне конкуренции.', s:5},
  {u:'Lexandi', d:'18 дней назад', t:'Брал TikTok монеты. Все честно, зашли на акк и купили. Рекомендую.', s:4},
  {u:'Nixiea', d:'3 недели назад', t:'ChatGPT Plus за такие деньги — это подарок. Пользуюсь уже месяц.', s:5},
  {u:'Jarolla', d:'3 недели назад', t:'Brawl Pass Plus активировали через код за 10 минут. Красавцы!', s:5}
];

let state = {tab:'catalog', lang:'ru', currency:'USD', rate:95, cat:'all'};

function render(){
  document.getElementById('curMover').style.transform = state.currency==='RUB'?'translateX(40px)':'translateX(0)';
  document.getElementById('langMover').style.transform = state.lang==='en'?'translateX(40px)':'translateX(0)';
  const v = document.getElementById('view');
  
  if(state.tab==='catalog'){
    let h = `<div class="chips"><div class="chip ${state.cat==='all'?'on':''}" data-cat="all">Все</div>`;
    CATALOG.forEach(c => h += `<div class="chip ${state.cat===c.id?'on':''}" data-cat="${c.id}">${c.emoji} ${c.title[state.lang]}</div>`);
    h += `</div><div class="hero"><div class="black-hole"></div><h1>ONCEDSHOP</h1><div class="cycling-text"><span id="adv-text">Лучшие цены и мгновенная выдача</span></div></div>`;
    (state.cat==='all'?CATALOG:CATALOG.filter(c=>c.id===state.cat)).forEach(c => c.items.forEach(p => {
      const pr = state.currency==='USD' ? ('$'+p.base.toFixed(2)) : (Math.round(p.base*state.rate).toLocaleString()+' ₽');
      h += `<div class="card"><div class="pic"><img src="${p.img}" onerror="this.src='https://img.icons8.com/color/96/box.png'"></div><div class="pinfo"><div class="t">${p.title[state.lang]}</div><div class="n">${p.note?p.note[state.lang]:''}</div><div class="pr">${pr} <small>/ ${p.unit}</small></div></div><button class="add-btn">+</button></div>`;
    }));
    v.innerHTML = h;
  } else if(state.tab==='reviews'){
    let h = '<div style="padding:20px"><h2>Отзывы клиентов</h2>';
    REVIEWS.forEach(r => {
      let st = ''; for(let i=0;i<5;i++) st += (i<r.s?'★':'☆');
      h += `<div class="rev-card"><div class="rev-top"><b>${r.u}</b><span>${r.d}</span></div><div class="rev-text">${r.t}</div><div class="rev-stars">${st}</div></div>`;
    });
    v.innerHTML = h + '</div>';
  } else {
    v.innerHTML = '<div style="padding:20px"><div class="tile" onclick="openCrypto()">💎 Оплата криптой<small>Реквизиты</small></div><div class="tile">❓ FAQ<small>Помощь</small></div></div>';
  }
  document.getElementById('nav-catalog').className = state.tab==='catalog'?'on':'';
  document.getElementById('nav-reviews').className = state.tab==='reviews'?'on':'';
  document.getElementById('nav-cabinet').className = state.tab==='cabinet'?'on':'';
}

function openCrypto(){
  document.getElementById('sheet').innerHTML = '<h3>Реквизиты</h3><div class="tile">TON: UQDE...Ks2</div><button class="cta" onclick="closeSheet()" style="all:unset;display:block;text-align:center;padding:16px;background:#fff;color:#000;border-radius:14px;font-weight:800;cursor:pointer;width:100%;">Закрыть</button>';
  document.getElementById('backdrop').classList.add('show');
}
function closeSheet(){ document.getElementById('backdrop').classList.remove('show'); }

document.addEventListener('click', e => {
  const d = e.target.closest('[data-tab],[data-lang],[data-cur],[data-cat]')?.dataset;
  if(!d) return;
  if(d.tab){ state.tab=d.tab; render(); window.scrollTo(0,0); if(tg) tg.HapticFeedback.impactOccurred('light'); }
  if(d.lang){ state.lang=d.lang; render(); if(tg) tg.HapticFeedback.impactOccurred('light'); }
  if(d.cur){ state.currency=d.cur; render(); if(tg) tg.HapticFeedback.impactOccurred('light'); }
  if(d.cat){ state.cat=d.cat; render(); if(tg) tg.HapticFeedback.impactOccurred('light'); }
});

document.addEventListener('DOMContentLoaded', () => {
  if(tg){tg.ready();tg.expand();tg.setHeaderColor('#000000');}
  render();
  setTimeout(()=>document.getElementById('splash').classList.add('hide'), 1200);
  setTimeout(()=>document.getElementById('app').classList.add('show'), 1300);
});
</script>
</body>
</html>
