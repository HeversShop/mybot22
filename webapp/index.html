<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'/>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'/>
<title>Oncedshop</title>
<script src='https://telegram.org/js/telegram-web-app.js'></script>
<style>
:root{
  --bg: #000000; --accent: #ffffff; --text: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.7);
  --text-muted: rgba(255, 255, 255, 0.45);
  --border: rgba(255, 255, 255, 0.1);
  --border-bright: rgba(255, 255, 255, 0.2);
  --radius-pill: 99px; --radius-lg: 24px; --radius-md: 18px;
  --font-main: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}
html,body{margin:0;padding:0;min-height:100%;background:#000;color-scheme: dark; overflow-x: hidden;}
body{font-family:var(--font-main); color:var(--text); display:flex;justify-content:center; -webkit-font-smoothing: antialiased;}
#app{width:100%;max-width:500px;min-height:100vh;padding-bottom:140px;opacity:0;transition:opacity 0.6s ease;}
#app.show{opacity:1;}

/* ===== SPLASH ===== */
.splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;transition:0.5s;}
.splash.hide{opacity:0;visibility:hidden;}
.splash-logo{width:80px;height:80px;border-radius:22px;background:#fff;color:#000;font-size:40px;font-weight:900;display:grid;place-items:center;animation:logoPulse 1.5s infinite alternate ease-in-out;}
@keyframes logoPulse{from{transform:scale(1);}to{transform:scale(1.1);box-shadow:0 0 30px rgba(255,255,255,0.2);}}

/* ===== TOPBAR ===== */
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;background:rgba(0,0,0,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:12px;}
.logo-sm{width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;color:#000;}

.pill-group{display:flex;background:rgba(255,255,255,0.08);border-radius:var(--radius-pill);padding:2px;position:relative;border:1px solid var(--border);width:84px;height:32px;margin-left:8px;}
.pill-group button{all:unset;flex:1;height:100%;font-size:11px;font-weight:800;color:var(--text-muted);cursor:pointer;z-index:2;position:relative;text-align:center;}
.pill-group button.on{color:#000;}
.pill-mover{position:absolute;top:2px;bottom:2px;width:40px;background:#fff;border-radius:var(--radius-pill);transition:transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);z-index:1;pointer-events:none;}

/* ===== HERO & BLACK HOLE ===== */
.hero{margin:16px;padding:50px 24px;border-radius:28px;background:#000;border:1px solid var(--border);position:relative;overflow:hidden;cursor:default;display:flex;flex-direction:column;align-items:center;text-align:center;}
.hero h1{margin:0;font-size:36px;font-weight:900;letter-spacing:-2px;position:relative;z-index:10; color:#fff; text-shadow: 0 0 30px rgba(0,0,0,1);}

.bh-container {
  position: absolute; inset: 0; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; opacity: 0.8;
}
.bh-core {
  width: 120px; height: 120px; background: #000; border-radius: 50%;
  box-shadow: 0 0 60px 10px rgba(255,255,255,0.1), inset 0 0 20px rgba(255,255,255,0.2);
  position: relative; z-index: 2;
}
.bh-ring {
  position: absolute; width: 300px; height: 300px;
  border-radius: 50%; border: 1px solid rgba(255,255,255,0.05);
  animation: bhRotate 15s linear infinite;
}
.bh-ring::before {
  content: ''; position: absolute; inset: -20px; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0%, rgba(255,255,255,0.1) 50%, transparent 100%);
  mask: radial-gradient(circle, transparent 40%, black 100%);
  -webkit-mask: radial-gradient(circle, transparent 40%, black 100%);
}
.bh-ring:nth-child(2) { animation-duration: 25s; width: 250px; height: 250px; opacity: 0.5; }
@keyframes bhRotate { from{transform:rotate(0deg) scale(1);} to{transform:rotate(360deg) scale(1.05);} }

/* ===== CARDS ===== */
.card{display:flex;align-items:center;gap:16px;padding:16px;border-radius:20px;margin:0 16px 12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);transition:0.2s;animation:cardIn 0.5s ease backwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
.pic{width:56px;height:56px;flex:0 0 56px;border-radius:14px;background:rgba(255,255,255,0.03);display:grid;place-items:center;overflow:hidden;}
.pic img{width:100%;height:100%;object-fit:contain;}
.pinfo{flex:1;min-width:0;}
.pinfo .t{font-size:15px;font-weight:800;margin-bottom:2px;}
.pinfo .n{font-size:10px;color:var(--text-secondary);line-height:1.4;margin-top:4px;font-weight:500;}
.pinfo .pr{font-size:16px;font-weight:900;margin-top:6px;color:var(--accent);}
.add-btn{all:unset;width:44px;height:44px;border-radius:14px;background:#fff;color:#000;display:grid;place-items:center;font-size:24px;cursor:pointer;margin-left:auto;}

/* ===== NAV ===== */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:calc(100% - 32px);max-width:440px;z-index:100;display:flex;padding:10px;background:rgba(20,20,20,0.85);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:28px;}
.nav button{all:unset;flex:1;text-align:center;padding:8px 0;color:var(--text-muted);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;}
.nav button.on{color:#fff;}
.nav button .ic{font-size:20px;opacity:0.6;}
.nav button.on .ic{opacity:1;transform:translateY(-2px);}

/* ===== REVIEWS ===== */
.rev-card{padding:18px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:20px;margin:0 16px 12px;}
.rev-top{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;}
.rev-text{font-size:14px;line-height:1.5;color:var(--text-secondary);}
.rev-stars{color:#ffb800;font-size:12px;margin-top:6px;}

.bg-watermark{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-10deg);font-size:18vw;font-weight:900;color:rgba(255,255,255,0.015);z-index:-1;text-transform:uppercase;pointer-events:none;}
</style>
</head>
<body>
<div id='splash' class='splash'><div class='splash-logo'>O</div></div>
<div class='bg-watermark'>Oncedshop</div>
<div id='app'>
  <div class='topbar'>
    <div class='brand'><div class='logo-sm'>O</div><div style='font-weight:800'>Oncedshop</div></div>
    <div style='display:flex;gap:8px'>
      <div class='pill-group'><div class='pill-mover' id='curMover'></div><button data-cur='USD'>$</button><button data-cur='RUB'>₽</button></div>
      <div class='pill-group'><div class='pill-mover' id='langMover'></div><button data-lang='ru'>RU</button><button data-lang='en'>EN</button></div>
    </div>
  </div>
  <div id='view'></div>
</div>
<div class='nav' id='nav-bar'>
  <button id='nav-catalog' data-tab='catalog'><span class='ic'>🛍️</span><span>Каталог</span></button>
  <button id='nav-reviews' data-tab='reviews'><span class='ic'>💬</span><span>Отзывы</span></button>
  <button id='nav-cabinet' data-tab='cabinet'><span class='ic'>👤</span><span>Профиль</span></button>
</div>
<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
const CATALOG = [
  {id:'tiktok',emoji:'📱',title:{ru:'TikTok',en:'TikTok'},items:[
    {id:'p_tt',title:{ru:'TikTok Монеты',en:'TikTok Coins'},img:'https://img.icons8.com/color/96/tiktok.png',base:0.0105,unit:'шт',kind:'perUnit',note:{ru:'Вход на аккаунт. 1.05р за 1 шт.',en:'Account login. 1.05 RUB per pc.'}}
  ]},
  {id:'rbx',emoji:'🟩',title:{ru:'Roblox',en:'Roblox'},items:[
    {id:'p_rbx_gp',title:{ru:'Robux GamePass',en:'Robux GP'},img:'https://img.icons8.com/color/96/roblox.png',base:0.0036,unit:'R$',kind:'perUnit',note:{ru:'$3.6 - 1000 рб (геймпасс). Выдача 5 дней.',en:'$3.6 - 1000 rb (GP). 5 days delivery.'}},
    {id:'p_rbx_pv',title:{ru:'Robux Private',en:'Robux Private'},img:'https://img.icons8.com/color/96/roblox-studio.png',base:0.003,unit:'R$',kind:'perUnit',note:{ru:'$3 - 1000 рб (приватный сервер). 5 дней.',en:'$3 - 1000 rb (PV). 5 days delivery.'}}
  ]},
  {id:'brawl',emoji:'🎮',title:{ru:'Brawl Stars',en:'Brawl Stars'},items:[
    {id:'p_bp_reg',title:{ru:'Brawl Pass',en:'Brawl Pass'},img:'https://img.icons8.com/color/96/supercell.png',base:3.15,unit:'акк',note:{ru:'300р. Код или вход на акк.',en:'300 RUB. Code or login.'}},
    {id:'p_bp_plus',title:{ru:'Brawl Pass Plus',en:'Brawl Pass Plus'},img:'https://img.icons8.com/color/96/supercell.png',base:3.68,unit:'акк',note:{ru:'350р. Код или вход на акк.',en:'350 RUB. Code or login.'}}
  ]},
  {id:'ai',emoji:'🤖',title:{ru:'AI Подписки',en:'AI Subs'},items:[
    {id:'p_gpt_p',title:{ru:'ChatGPT Plus (Личный)',en:'ChatGPT Plus'},img:'https://img.icons8.com/color/96/chatgpt.png',base:1.89,unit:'мес',note:{ru:'180р. Гарантия весь срок.',en:'180 RUB. Full warranty.'}},
    {id:'p_gem_18',title:{ru:'Gemini 18 мес',en:'Gemini 18m'},img:'https://img.icons8.com/color/96/google-logo.png',base:1.05,unit:'акк',note:{ru:'100р. Гарантия весь срок.',en:'100 RUB. Full warranty.'}},
    {id:'p_claude_30',title:{ru:'Claude PRO 30д',en:'Claude PRO 30d'},img:'https://img.icons8.com/color/96/brain.png',base:3.15,unit:'мес',note:{ru:'300р. Без гарантии.',en:'300 RUB. No warranty.'}}
  ]},
  {id:'virta',emoji:'💰',title:{ru:'Вирты',en:'Virts'},items:[
    {id:'p_rad',title:{ru:'Radmir RP',en:'Radmir'},img:'https://sc04.alicdn.com/kf/A9212c3b0f6d44b9c90de0a8d54f2ad4cx.jpg',base:0.55,unit:'1kk',kind:'perUnit',note:{ru:'52р/1кк. Банк, трейд, авто.',en:'52r/1m. Bank, trade, car.'}},
    {id:'p_ama',title:{ru:'Amazing RP',en:'Amazing'},img:'https://sc04.alicdn.com/kf/A73993f3356a7447187b73f4b8b4fea8dP.jpg',base:0.47,unit:'1kk',kind:'perUnit',note:{ru:'45р/1кк. Банк, трейд, авто.',en:'45r/1m. Bank, trade, car.'}},
    {id:'p_br',title:{ru:'Black Russia',en:'Black Russia'},img:'https://sc04.alicdn.com/kf/A0e637ec6d6f141e39e483a5fc88d325bH.jpg',base:0.37,unit:'1kk',kind:'perUnit',note:{ru:'35р/1кк. Банк, трейд, авто.',en:'35r/1m. Bank, trade, car.'}},
    {id:'p_maj',title:{ru:'Majestic RP',en:'Majestic'},img:'https://sc04.alicdn.com/kf/A6fab1941243d4afaa1f1641cd9e3f6cfk.jpg',base:3.16,unit:'1kk',kind:'perUnit',note:{ru:'0.30р/1к. Покер, банк, авто.',en:'0.30r/1k. Poker, bank, car.'}},
    {id:'p_arz',title:{ru:'Arizona RP',en:'Arizona'},img:'https://sc04.alicdn.com/kf/A356ac4bfea8f4fbe902d356556a27f210.jpg',base:2.63,unit:'1kkk',kind:'perUnit',note:{ru:'0.25р/1кк. Банк, трейд, авто.',en:'0.25r/1m. Bank, trade, car.'}}
  ]}
];
const REVIEWS = [
  {u:'Vaugham', d:'Сегодня, 11:15', t:'Взял вирты на Majestic. Лучший курс на рынке, выдали оперативно. Очень доволен сервисом!', s:5},
  {u:'Feryl', d:'Вчера, 19:40', t:'1000 Stars пришли практически мгновенно. Спасибо саппорту за помощь с оплатой.', s:5},
  {u:'Mandr', d:'2 дня назад', t:'Дизайн с черной дырой просто пушка! Выглядит очень стильно и современно. Буду брать еще.', s:5},
  {u:'Cotyl', d:'5 дней назад', t:'Arizona пришла, пришлось подождать пару часов, но курс того стоит. Рекомендую!', s:4},
  {u:'Wanell', d:'1 неделю назад', t:'Робуксы зашли через день. Все честно, без скрытых комиссий. Топ магазин!', s:5},
  {u:'Relitha', d:'10 дней назад', t:'Claude PRO работает стабильно. Данные выдали через бота сразу после оплаты.', s:5},
  {u:'Gunna', d:'2 недели назад', t:'Уже четвертая покупка тут. Ни разу не подвели, цены вне конкуренции на все игры.', s:5},
  {u:'Lexandi', d:'18 дней назад', t:'Брал TikTok монеты. Все честно, зашли на акк и купили. Доволен как слон!', s:4},
  {u:'Nixiea', d:'3 недели назад', t:'ChatGPT Plus за такие деньги — это подарок. Пользуюсь уже месяц без проблем.', s:5},
  {u:'Jarolla', d:'3 недели назад', t:'Brawl Pass Plus активировали очень быстро. Ребята знают свое дело. Спасибо!', s:5}
];

let state = {tab:'catalog', lang:'ru', currency:'USD', rate:95, cat:'all'};

function render(){
  document.getElementById('curMover').style.transform = state.currency==='RUB'?'translateX(40px)':'translateX(0)';
  document.getElementById('langMover').style.transform = state.lang==='en'?'translateX(40px)':'translateX(0)';
  const v = document.getElementById('view');
  if(state.tab==='catalog'){
    let h = `<div class="chips"><div class="chip ${state.cat==='all'?'on':''}" data-cat="all">Все</div>`;
    CATALOG.forEach(c => h += `<div class="chip ${state.cat===c.id?'on':''}" data-cat="${c.id}">${c.emoji} ${c.title[state.lang]}</div>`);
    h += `</div><div class="hero"><div class="bh-container"><div class="bh-ring"></div><div class="bh-ring"></div><div class="bh-core"></div></div><h1>ONCEDSHOP</h1><div style="font-size:14px;color:rgba(255,255,255,0.6);margin-top:8px;position:relative;z-index:10">Лучшие цены и мгновенная выдача</div></div>`;
    (state.cat==='all'?CATALOG:CATALOG.filter(c=>c.id===state.cat)).forEach(c => c.items.forEach(p => {
      const pr = state.currency==='USD' ? ('$'+p.base.toFixed(2)) : (Math.round(p.base*state.rate).toLocaleString()+' ₽');
      h += `<div class="card"><div class="pic"><img src="${p.img}"></div><div class="pinfo"><div class="t">${p.title[state.lang]}</div><div class="n">${p.note?p.note[state.lang]:''}</div><div class="pr">${pr} <small>/ ${p.unit}</small></div></div><button class="add-btn">+</button></div>`;
    }));
    v.innerHTML = h;
  } else if(state.tab==='reviews'){
    let h = '<div style="padding:20px"><h2>Отзывы</h2>' + REVIEWS.map(r => {
      let st = ''; for(let i=0;i<5;i++) st += (i<r.s?'★':'☆');
      return `<div class="rev-card"><div class="rev-top"><b>${r.u}</b><span>${r.d}</span></div><div class="rev-text">${r.t}</div><div class="rev-stars">${st}</div></div>`;
    }).join('') + '</div>';
  } else {
    v.innerHTML = '<div style="padding:20px"><div class="tile">👤 Guest</div></div>';
  }
  ['catalog','reviews','cabinet'].forEach(t => {
    const b = document.getElementById('nav-'+(t==='cabinet'?'prof':t==='reviews'?'rev':'cat'));
    if(b) b.className = state.tab===t?'on':'';
  });
}
function init(){
  if(tg){tg.ready();tg.expand();tg.setHeaderColor('#000000');}
  render();
  setTimeout(() => { document.getElementById('splash').classList.add('hide'); document.getElementById('app').classList.add('show'); }, 1200);
}
document.addEventListener('click', e => {
  const d = e.target.closest('[data-tab],[data-lang],[data-cur],[data-cat]')?.dataset;
  if(!d) return;
  if(d.tab){ state.tab=d.tab; render(); window.scrollTo(0,0); }
  if(d.lang){ state.lang=d.lang; render(); }
  if(d.cur){ state.currency=d.cur; render(); }
  if(d.cat){ state.cat=d.cat; render(); }
  if(tg) tg.HapticFeedback.impactOccurred('light');
});
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
