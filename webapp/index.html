<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'/>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'/>
<title>Oncedshop</title>
<script src='https://telegram.org/js/telegram-web-app.js'></script>
<style>
:root{
  --bg: #000000;
  --accent: #ffffff;
  --text: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.7);
  --text-muted: rgba(255, 255, 255, 0.45);
  --border: rgba(255, 255, 255, 0.1);
  --border-bright: rgba(255, 255, 255, 0.2);
  --radius-pill: 99px;
  --font-main: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}
html,body{margin:0;padding:0;min-height:100%;background:#000;color-scheme: dark;}
body{font-family:var(--font-main); color:var(--text); display:flex;justify-content:center; overflow-x:hidden; -webkit-font-smoothing: antialiased;}
#app{width:100%;max-width:500px;min-height:100vh;padding-bottom:140px;opacity:0;transition:opacity 0.6s ease;}
#app.show{opacity:1;}

/* ===== SPLASH ===== */
.splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;transition:0.5s;}
.splash.hide{opacity:0;visibility:hidden;}
.splash-logo{width:80px;height:80px;border-radius:22px;background:#fff;color:#000;font-size:40px;font-weight:900;display:grid;place-items:center;animation:logoPulse 1.5s infinite alternate ease-in-out;}
@keyframes logoPulse{from{transform:scale(1);}to{transform:scale(1.1);box-shadow:0 0 30px rgba(255,255,255,0.2);}}

/* ===== TOPBAR ===== */
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;background:rgba(0,0,0,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:12px;}
.logo-sm{width:38px;height:38px;border-radius:11px;background:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;color:#000;}

.pill-group{display:flex;background:rgba(255,255,255,0.08);border-radius:var(--radius-pill);padding:2px;position:relative;border:1px solid var(--border);width:84px;height:32px;}
.pill-group button{all:unset;flex:1;height:100%;font-size:11px;font-weight:800;color:var(--text-muted);cursor:pointer;z-index:2;position:relative;text-align:center;}
.pill-group button.on{color:#000;}
.pill-mover{position:absolute;top:2px;bottom:2px;width:40px;background:#fff;border-radius:var(--radius-pill);transition:transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);z-index:1;pointer-events:none;}

/* ===== HERO & BLACK HOLE ===== */
.hero{margin:16px;padding:40px 24px;border-radius:24px;background:rgba(255,255,255,0.03);border:1px solid var(--border);position:relative;overflow:hidden;cursor:default;}
.hero h1{margin:0;font-size:32px;font-weight:900;letter-spacing:-1.5px;position:relative;z-index:5;}
.black-hole {
  position: absolute; right: -40px; top: -40px; width: 180px; height: 180px;
  background: radial-gradient(circle, #000 15%, #111 30%, transparent 65%);
  border-radius: 50%; opacity: 0; transform: scale(0.5); transition: 1s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none; z-index: 1;
}
.black-hole::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.1); border-top-color: #fff;
  animation: holeRotate 2s linear infinite;
}
@keyframes holeRotate { from{transform:rotate(0);} to{transform:rotate(360deg);} }
.hero:hover .black-hole { opacity: 1; transform: scale(1.4) rotate(180deg); box-shadow: 0 0 60px 10px rgba(255,255,255,0.05); }

/* ===== CARDS ===== */
.card{display:flex;align-items:center;gap:16px;padding:16px;border-radius:20px;margin:0 16px 12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);transition:0.2s;animation:cardIn 0.5s ease backwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
.pic{width:56px;height:56px;flex:0 0 56px;border-radius:14px;background:rgba(255,255,255,0.03);display:grid;place-items:center;overflow:hidden;}
.pic img{width:100%;height:100%;object-fit:cover;}

/* ===== NAV ===== */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;width:calc(100% - 32px);max-width:440px;z-index:100;display:flex;padding:10px;background:rgba(20,20,20,0.85);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,0.5);}
.nav button{all:unset;flex:1;text-align:center;padding:8px 0;color:var(--text-muted);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
.nav button.on{color:#fff;}
.nav button .ic{font-size:22px;opacity:0.6;}
.nav button.on .ic{opacity:1;transform:translateY(-2px);}

/* ===== REVIEWS ===== */
.rev-card{padding:18px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:20px;margin:0 16px 12px;}
.rev-top{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;}
.rev-user{font-weight:800;color:var(--accent);}
.rev-date{color:var(--text-muted);}
.rev-text{font-size:14px;line-height:1.5;color:var(--text-secondary);}

.tile{display:flex;align-items:center;gap:14px;padding:18px;background:linear-gradient(135deg,rgba(255,255,255,0.06),rgba(255,255,255,0.01));border:1px solid var(--border);border-radius:18px;margin-bottom:12px;cursor:pointer;}
.backdrop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.85);opacity:0;pointer-events:none;transition:0.3s;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px);}
.backdrop.show{opacity:1;pointer-events:auto;}
.sheet{width:100%;max-width:500px;background:#0f0f0f;border-top:1px solid var(--border-bright);border-radius:32px 32px 0 0;padding:24px 24px 40px;transform:translateY(100%);transition:0.4s cubic-bezier(0.4,0,0.2,1);max-height:85vh;overflow-y:auto;}
.backdrop.show .sheet{transform:translateY(0);}
</style>
</head>
<body>
<div id='splash' class='splash'><div class='splash-logo'>O</div></div>
<div id='app'>
  <div class='topbar'>
    <div class='brand'><div class='logo-sm'>O</div><div style='font-weight:800'>Oncedshop</div></div>
    <div style='display:flex;gap:8px'>
      <div class='pill-group'><div class='pill-mover' id='curMover'></div><button data-cur='USD'>$</button><button data-cur='RUB'>₽</button></div>
      <div class='pill-group'><div class='pill-mover' id='langMover'></div><button data-lang='ru'>RU</button><button data-lang='en'>EN</button></div>
    </div>
  </div>
  <div id='view'></div>
</div>
<div class='nav'>
  <button id='nav-catalog' data-tab='catalog'><span class='ic'>🛍️</span><span>Каталог</span></button>
  <button id='nav-reviews' data-tab='reviews'><span class='ic'>💬</span><span>Отзывы</span></button>
  <button id='nav-cabinet' data-tab='cabinet'><span class='ic'>👤</span><span>Профиль</span></button>
</div>
<div class='backdrop' id='backdrop' onclick="closeSheet()"><div class='sheet' id='sheet' onclick="event.stopPropagation()"></div></div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
const CATALOG = [
  {id:'stars',title:{ru:'Telegram Stars',en:'Stars'},items:[{id:'p1',title:{ru:'Stars 1000',en:'Stars 1000'},img:'https://img.icons8.com/color/96/telegram-app.png',base:12}]},
  {id:'tiktok',title:{ru:'TikTok',en:'TikTok'},items:[{id:'p2',title:{ru:'TikTok Монеты',en:'TikTok Coins'},img:'https://img.icons8.com/color/96/tiktok.png',base:0.0105}]},
  {id:'virta',title:{ru:'Вирты',en:'Virts'},items:[
    {id:'p3',title:{ru:'Majestic RP',en:'Majestic'},img:'https://sun9-24.userapi.com/impf/c850624/v850624383/107f9c/7p5G-QxX_z0.jpg?size=200x200&quality=96&type=album',base:2.11},
    {id:'p4',title:{ru:'Arizona RP',en:'Arizona'},img:'https://sun9-62.userapi.com/impf/c855224/v855224098/197b10/Vn9mX3R297U.jpg?size=200x200&quality=96&type=album',base:2.63}
  ]},
  {id:'ai',title:{ru:'AI Подписки',en:'AI Subs'},items:[
    {id:'p5',title:{ru:'ChatGPT Plus',en:'ChatGPT Plus'},img:'https://img.icons8.com/color/96/chatgpt.png',base:3.15},
    {id:'p6',title:{ru:'Gemini 18m',en:'Gemini 18m'},img:'https://img.icons8.com/color/96/google-logo.png',base:1.05}
  ]}
];

const REVIEWS = [
  {u:'Аноним', d:'Сегодня, 10:15', t:'Выдали Majestic за 5 минут. Логотипы теперь красивые!'},
  {u:'Аноним', d:'Вчера, 23:40', t:'Брал 1000 Stars, все супер. Рекомендую шоп.'},
  {u:'Аноним', d:'2 дня назад', t:'Черная дыра на главной просто пушка! Понравился дизайн.'},
  {u:'Аноним', d:'5 дней назад', t:'Аризона пришла быстро. Курс доллара радует.'},
  {u:'Аноним', d:'1 неделя назад', t:'Лучшие цены на AI подписки. Брал ChatGPT.'},
  {u:'Аноним', d:'10 дней назад', t:'Бот работает стабильно, оплата криптой удобная.'},
  {u:'Аноним', d:'2 недели назад', t:'Все честно, без обмана. Покупаю тут уже третий раз.'},
  {u:'Аноним', d:'3 недели назад', t:'Спасибо за TikTok монеты! Самый выгодный курс.'}
];

let state = {tab:'catalog', lang:'ru', currency:'USD', rate:95};

function render(){
  document.getElementById('curMover').style.transform = state.currency==='RUB'?'translateX(40px)':'translateX(0)';
  document.getElementById('langMover').style.transform = state.lang==='en'?'translateX(40px)':'translateX(0)';
  const v = document.getElementById('view');
  
  if(state.tab==='catalog'){
    let h = '<div class="hero"><div class="black-hole"></div><h1>ONCEDSHOP</h1><div style="font-size:14px;color:rgba(255,255,255,0.6);margin-top:8px">Лучшие цены и мгновенная выдача</div></div>';
    CATALOG.forEach(c => c.items.forEach(p => {
      const pr = state.currency==='USD' ? ('$'+(p.base*1.12).toFixed(2)) : (Math.round(p.base*1.12*state.rate).toLocaleString()+' ₽');
      h += `<div class="card"><div class="pic"><img src="${p.img}" onerror="this.src='https://img.icons8.com/color/96/box.png'"></div><div class="pinfo"><div class="t">${p.title[state.lang]}</div><div class="pr">${pr}</div></div><button class="add-btn">+</button></div>`;
    }));
    v.innerHTML = h;
  } else if(state.tab==='reviews'){
    let h = '<div style="padding:20px"><h2>Отзывы клиентов</h2>';
    REVIEWS.forEach(r => h += `<div class="rev-card"><div class="rev-top"><b class="rev-user">${r.u}</b><span class="rev-date">${r.d}</span></div><div class="rev-text">${r.t}</div></div>`);
    v.innerHTML = h + '</div>';
  } else {
    v.innerHTML = '<div style="padding:20px"><div class="tile" onclick="openCrypto()">💎 Оплата криптой<small>Реквизиты</small></div><div class="tile" onclick="state.tab=\'catalog\';render();">❓ FAQ<small>Помощь</small></div></div>';
  }
  document.getElementById('nav-catalog').className = state.tab==='catalog'?'on':'';
  document.getElementById('nav-reviews').className = state.tab==='reviews'?'on':'';
  document.getElementById('nav-cabinet').className = state.tab==='cabinet'?'on':'';
}

function openCrypto(){
  document.getElementById('sheet').innerHTML = '<h3>Реквизиты</h3><div class="tile">TON: UQDE...Ks2</div><button class="cta" onclick="closeSheet()" style="all:unset;display:block;text-align:center;padding:16px;background:#fff;color:#000;border-radius:14px;font-weight:800;cursor:pointer;">Закрыть</button>';
  document.getElementById('backdrop').classList.add('show');
}
function closeSheet(){ document.getElementById('backdrop').classList.remove('show'); }

document.addEventListener('click', e => {
  const d = e.target.closest('[data-tab],[data-lang],[data-cur]')?.dataset;
  if(!d) return;
  if(d.tab){ state.tab=d.tab; render(); window.scrollTo(0,0); if(tg) tg.HapticFeedback.impactOccurred('light'); }
  if(d.lang){ state.lang=d.lang; render(); if(tg) tg.HapticFeedback.impactOccurred('light'); }
  if(d.cur){ state.currency=d.cur; render(); if(tg) tg.HapticFeedback.impactOccurred('light'); }
});

document.addEventListener('DOMContentLoaded', () => {
  if(tg){tg.ready();tg.expand();tg.setHeaderColor('#000000');}
  render();
  setTimeout(()=>document.getElementById('splash').classList.add('hide'), 1200);
  setTimeout(()=>document.getElementById('app').classList.add('show'), 1300);
});
</script>
</body>
</html>
