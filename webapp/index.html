<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'/>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'/>
<title>Oncedshop</title>
<script src='https://telegram.org/js/telegram-web-app.js'></script>
<style>
:root{
  --bg: #000000;
  --bg-card: #0a0a0a;
  --accent: #ffffff;
  --primary: #ffffff;
  --text: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.7);
  --text-muted: rgba(255, 255, 255, 0.45);
  --border: rgba(255, 255, 255, 0.1);
  --border-bright: rgba(255, 255, 255, 0.2);
  --radius-pill: 99px;
  --radius-lg: 20px;
  --radius-md: 16px;
  --font-main: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color-scheme: dark;}
body{
 font-family:var(--font-main);
 color:var(--text);
 display:flex;justify-content:center;
 overflow-x:hidden;
 -webkit-font-smoothing: antialiased;
}
#app{width:100%;max-width:500px;min-height:100vh;padding-bottom:120px;position:relative;}

/* ===== PREMIUM TOGGLES ===== */
.pill-group {
  display: flex;
  background: rgba(255,255,255,0.08);
  border-radius: var(--radius-pill);
  padding: 2px;
  position: relative;
  border: 1px solid var(--border);
  width: 84px; /* Фиксированная ширина группы */
  height: 32px;
  align-items: center;
}
.pill-group button {
  all: unset;
  flex: 1;
  height: 100%;
  font-size: 11px;
  font-weight: 800;
  color: var(--text-muted);
  cursor: pointer;
  z-index: 2;
  position: relative;
  transition: color 0.3s ease;
  text-align: center;
}
.pill-group button.on {
  color: #000;
}
.pill-mover {
  position: absolute;
  top: 2px;
  bottom: 2px;
  width: 40px; /* Ровно половина минус отступы */
  background: #fff;
  border-radius: var(--radius-pill);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 1;
}

/* ===== TOPBAR ===== */
.topbar{
 position:sticky;top:0;z-index:100;
 display:flex;align-items:center;justify-content:space-between;
 padding:20px 20px 16px;
 background:rgba(0, 0, 0, 0.85);
 backdrop-filter: blur(20px);
 -webkit-backdrop-filter: blur(20px);
 border-bottom: 1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:12px;}
.logo{
 width:40px;height:40px;border-radius:11px;
 background: linear-gradient(135deg, #fff 0%, #d0d0d0 100%);
 display:grid;place-items:center;
 font-size:20px;font-weight:900;color:#000;
 box-shadow: 0 4px 15px rgba(255,255,255,0.1);
}
.brand-name{font-size:18px;font-weight:700;letter-spacing:-0.4px;}
.brand-sub{font-size:10px;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px;font-weight:600;}

/* ===== NAV ===== */
.nav{
 position:fixed;left:50%;transform:translateX(-50%);bottom:16px;
 width:calc(100% - 32px);max-width:448px;z-index:100;
 display:flex;padding:10px;
 background: rgba(20, 20, 20, 0.85);
 backdrop-filter: blur(24px);
 -webkit-backdrop-filter: blur(24px);
 border: 1px solid var(--border-bright);
 border-radius: 28px;
 box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}
.nav button{
 all:unset;flex:1;text-align:center;padding:8px 0;
 color:var(--text-muted);font-size:11px;font-weight:600;
 cursor:pointer;position:relative;
 transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
 display: flex;flex-direction: column;align-items: center;gap:4px;
}
.nav button .ic{display:block;font-size:24px;opacity: 0.6; transition: 0.2s;}
.nav button.on{color:var(--accent);}
.nav button.on .ic{opacity: 1; transform: translateY(-2px);}
.nav .nbadge{
 position:absolute;top:-4px;right:calc(50% - 22px);
 background:var(--primary);color:#fff;
 font-size:10px;font-weight:800;min-width:18px;height:18px;
 border-radius:9px;display:grid;place-items:center;padding:0 4px;
 border: 2px solid #141414;
}

/* ===== HERO ===== */
.hero{
 margin:16px 14px 24px;padding:28px 24px;
 border-radius:var(--radius-lg);
 background: linear-gradient(145deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.01) 100%);
 border:1px solid var(--border);
 position:relative;overflow:hidden;
}
.hero h1{margin:0 0 8px;font-size:26px;font-weight:800;letter-spacing:-0.5px;}
.hero p{margin:0;font-size:14px;color:var(--text-secondary);line-height:1.6;max-width:85%;}
.hero-rate{margin-top:16px;font-size:12px;color:var(--text-muted);font-weight:500; display:flex; align-items:center; gap:6px;}
.hero-rate::before {content:''; width:6px; height:6px; background:#4ade80; border-radius:50%; box-shadow:0 0 8px #4ade80;}

/* ===== CHIPS ===== */
.chips{
 display:flex;gap:8px;overflow-x:auto;padding:4px 16px 16px;
 scrollbar-width:none;-webkit-overflow-scrolling:touch;
 width: 100%;
}
.chips::-webkit-scrollbar { display: none; }
.chip{
 flex:0 0 auto;padding:10px 18px;border-radius:12px;
 font-size:13px;font-weight:600;cursor:pointer;
 background:var(--card-bg);border:1px solid var(--border);
 color:var(--text-secondary);white-space:nowrap;
 transition: all 0.2s ease;
}
.chip.on{background:var(--accent);color:#000;border-color:var(--accent);box-shadow: 0 4px 15px rgba(255,255,255,0.15);}

/* ===== DESIGNER BACKGROUND ===== */
.bg-watermark {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) rotate(-10deg);
  font-size: 18vw;
  font-weight: 900;
  color: rgba(255,255,255,0.02);
  white-space: nowrap;
  user-select: none;
  pointer-events: none;
  z-index: -1;
  text-transform: uppercase;
  letter-spacing: -2px;
  animation: bgFloat 20s infinite alternate ease-in-out;
}
@keyframes bgFloat {
  from { transform: translate(-52%, -48%) rotate(-10deg); }
  to { transform: translate(-48%, -52%) rotate(-8deg); }
}

/* ===== CYCLING TEXT ===== */
.cycling-text {
  height: 20px;
  overflow: hidden;
  margin-top: 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
}
#adv-text {
  display: block;
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  opacity: 1;
  transform: translateY(0);
}
.text-out { opacity: 0!important; transform: translateY(-10px)!important; }
.text-in { opacity: 0!important; transform: translateY(10px)!important; }

/* ===== ANIMATIONS ===== */
.card {
  animation: cardFadeIn 0.5s ease backwards;
}
@keyframes cardFadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.card:active{transform: scale(0.98); background: rgba(255,255,255,0.08); border-color: var(--border-bright);}
.pic{
 width:52px;height:52px;flex:0 0 52px;
 border-radius:14px;display:grid;place-items:center;
 font-size:24px;
 background: rgba(255,255,255,0.03);
 border: 1px solid var(--border);
}
.pinfo .t{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:2px;}
.pinfo .n{font-size:11px;color:var(--text-muted);font-weight:500;}
.pinfo .pr{font-size:16px;font-weight:700;margin-top:6px;color:var(--accent);}
.add-btn{
 all:unset;cursor:pointer;
 width:44px;height:44px;flex:0 0 44px;
 border-radius:13px;background:var(--accent);color:#000;
 display:grid;place-items:center;font-size:24px;font-weight:400;
 transition: 0.2s; margin-left:auto;
}
.add-btn:active{transform:scale(0.9);}


/* ===== CART ===== */
.cart-item{
 display:flex;align-items:center;gap:10px;
 padding:12px;border-radius:14px;margin-bottom:8px;
 background:var(--card);border:1px solid var(--border);
}
.cart-item .t{flex:1;min-width:0;font-size:13px;font-weight:700;}
.cart-item .t small{display:block;color:var(--faint);font-weight:500;margin-top:2px;font-size:11px;}
.cart-item .ln{font-weight:900;font-size:14px;white-space:nowrap;margin-right:8px;}
.qtybox{display:flex;align-items:center;gap:5px;}
.qbtn{
 all:unset;cursor:pointer;width:28px;height:28px;
 border-radius:8px;background:var(--card2);border:1px solid var(--border);
 display:grid;place-items:center;font-size:16px;color:var(--accent2);
}
.qn{min-width:24px;text-align:center;font-weight:800;font-size:13px;}
.rm{
 all:unset;cursor:pointer;color:var(--faint);font-size:16px;
 width:32px;height:32px;display:grid;place-items:center;
}

/* ===== FIELDS ===== */
.field{
 width:100%;padding:13px 14px;
 border-radius:12px;font-size:15px;color:#fff;
 background:var(--card);border:1px solid var(--border2);
}
.field:focus{outline:none;border-color:#fff;}
.label{font-size:12px;color:var(--muted);font-weight:700;margin:14px 2px 5px;}

/* ===== SUMMARY ===== */
.summary{
 margin-top:14px;padding:15px;
 border-radius:14px;background:var(--card);border:1px solid var(--border);
}
.summary .row{
 display:flex;justify-content:space-between;
 font-size:13px;color:var(--muted);margin-bottom:7px;
}
.summary .total{
 display:flex;justify-content:space-between;
 font-size:18px;font-weight:900;
 padding-top:10px;border-top:1px solid var(--border2);
}
.progress{
 height:5px;border-radius:99px;
 background:var(--card2);overflow:hidden;margin:10px 0 4px;
}
.progress i{
 display:block;height:100%;
 border-radius:99px;background:#fff;transition:.3s;
}
.hint{font-size:12px;color:var(--muted);margin-top:5px;}

/* ===== CTA ===== */
.cta{
 all:unset;display:block;text-align:center;
 margin-top:14px;padding:15px;
 border-radius:13px;font-size:16px;font-weight:900;
 cursor:pointer;background:#fff;color:#000;
}
.cta.off{background:var(--card2);color:var(--faint);}
.cta.dark{background:var(--card2);color:var(--accent2);border:1px solid var(--border);}
.cta:active{transform:scale(.99);}

/* ===== PROFILE ===== */
.profile{
 display:flex;align-items:center;gap:14px;
 padding:18px;border-radius:var(--radius);
 background:var(--card);border:1px solid var(--border2);
}
.ava{
 width:60px;height:60px;flex:0 0 60px;
 border-radius:50%;background:#fff;color:#000;
 display:grid;place-items:center;
 font-size:24px;font-weight:900;overflow:hidden;
}
.ava img{width:100%;height:100%;object-fit:cover;}
.profile .nm{font-size:18px;font-weight:900;}
.profile .un{font-size:12px;color:var(--muted);margin-top:2px;}
.profile .pid{font-size:11px;color:var(--faint);margin-top:2px;}
.stats{display:flex;gap:8px;margin-top:12px;}
.stat{
 flex:1;padding:13px;border-radius:13px;text-align:center;
 background:var(--card);border:1px solid var(--border);
}
.stat b{display:block;font-size:20px;font-weight:900;}
.stat span{font-size:11px;color:var(--muted);}
/* ===== PROFILE TILES ===== */
.tile{
  display:flex;align-items:center;gap:14px;
  padding:16px;border-radius:var(--radius-md);margin-top:10px;
  background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
  border:1px solid var(--border);
  cursor:pointer;font-size:15px;font-weight:600;
  transition: all 0.2s ease;
}
.tile:active{
  transform: scale(0.98);
  background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
  border-color: var(--border-bright);
}
.tile .ic{font-size:22px;width:28px;text-align:center; opacity: 0.9;}
.tile small{display:block;color:var(--text-muted);font-weight:500;font-size:12px;margin-top:2px;}
.tile .ar{margin-left:auto;color:var(--text-muted); font-size: 18px;}

/* ===== ORDERS ===== */
.ord{
 padding:12px;border-radius:13px;margin-top:8px;
 background:var(--card);border:1px solid var(--border);
}
.ord .top{display:flex;justify-content:space-between;font-size:12px;}
.ord .oid{font-family:monospace;color:#fff;font-weight:900;}
.ord .st{color:var(--good);font-weight:700;}
.ord .bt{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;}

/* ===== EMPTY ===== */
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px;line-height:1.6;}
.empty .big{font-size:48px;display:block;margin-bottom:10px;}

/* ===== SHEET ===== */
.backdrop{
 position:fixed;inset:0;z-index:50;
 background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
 display:flex;align-items:flex-end;justify-content:center;
 opacity:0;pointer-events:none;transition:.2s;
}
.backdrop.show{opacity:1;pointer-events:auto;}
.sheet{
 width:100%;max-width:500px;
 background:#111;border-top:1px solid var(--border-bright);
 border-top-left-radius:28px;border-top-right-radius:28px;
 padding:20px 20px calc(100px + env(safe-area-inset-bottom)); /* Увеличен отступ снизу */
 transform:translateY(100%);transition:.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.backdrop.show .sheet{transform:none;}
.grab{width:40px;height:4px;border-radius:99px;background:var(--border2);margin:0 auto 18px;}
.sheet h3{margin:0 0 4px;font-size:18px;font-weight:900;}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:14px;}

/* ===== STEPPER ===== */
.stepper{display:flex;align-items:center;gap:12px;justify-content:center;margin:10px 0;}
.stepper button{
 all:unset;cursor:pointer;width:52px;height:52px;
 border-radius:14px;display:grid;place-items:center;
 font-size:26px;background:var(--card2);border:1px solid var(--border2);color:#fff;
}
.stepper input{
 width:120px;text-align:center;
 font-size:22px;font-weight:900;color:#fff;
 background:transparent;border:none;
}
.stepper input:focus{outline:none;}
.sheet-price{text-align:center;font-size:28px;font-weight:900;margin:8px 0 2px;}
.tier-note{text-align:center;font-size:12px;color:var(--good);margin-bottom:4px;min-height:16px;}

/* ===== CRYPTO ROWS ===== */
.crow{
 background:var(--card);border:1px solid var(--border);
 border-radius:13px;padding:10px 12px;margin:7px 0;
}
.crow .ctop{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.crow .addr{margin-top:6px;font-family:monospace;font-size:11px;word-break:break-all;color:var(--muted);}

/* ===== BALANCE CARD ===== */
.bal-card{
 background:var(--card);border:1px solid var(--border2);
 border-radius:var(--radius);padding:14px 16px;margin:12px 0;
}
.bal-card .bal-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.bal-card .bal-label{opacity:.7;font-size:13px;}
.bal-card .bal-amount{font-size:26px;font-weight:900;}

/* ===== TOAST ===== */
.toast{
 position:fixed;left:50%;bottom:100px;
 transform:translateX(-50%) translateY(16px);
 z-index:60;background:#fff;color:#000;
 padding:11px 20px;border-radius:12px;
 font-size:13px;font-weight:800;
 opacity:0;transition:.2s;pointer-events:none;
 max-width:86%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== LOGIN ===== */
.login{
 position:fixed;inset:0;z-index:9999;
 display:flex;align-items:center;justify-content:center;padding:24px;
 background:#000;
}
.login.hidden{display:none;}
.lcard{
 width:100%;max-width:340px;text-align:center;
 background:var(--card);border:1px solid var(--border2);
 border-radius:22px;padding:36px 22px;
}
.lcard .lic{font-size:54px;margin-bottom:12px;}
.lcard .lt{font-size:24px;font-weight:900;margin-bottom:8px;}
.lcard .ls{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:22px;}
.lcard .lhint{color:var(--faint);font-size:11px;margin-top:14px;}

/* ===== SENT SCREEN ===== */
.sent-screen{
 position:fixed;inset:0;z-index:9999;
 background:#000;display:flex;align-items:center;justify-content:center;padding:24px;
}
/* ===== CART ANIMATION ===== */
@keyframes cartPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); color: #fff; }
  100% { transform: scale(1); }
}
.cart-pop { animation: cartPulse 0.4s ease; }

@keyframes flyToCart {
  0% { transform: translate(0, 0) scale(1); opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; }
}
.flyer {
  position: fixed; z-index: 9999; pointer-events: none;
  background: var(--accent); color: #000; width: 20px; height: 20px;
  border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 900;
}
.snote{color:var(--muted);font-size:12px;margin:8px 0 2px;line-height:1.4;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

<div class='bg-watermark'>Oncedshop</div>
<div id='login' class='login'></div>
<div id='sent' class='sent-screen hidden'></div>
<div id='app'>
 <div class='topbar'>
  <div class='brand'>
   <div class='logo'>O</div>
   <div>
    <div class='brand-name'>Oncedshop</div>
    <div class='brand-sub' id='tagline'>Digital Store</div>
   </div>
  </div>
  <div class='topbar-right'>
   <div class='pill-group'>
    <div class='pill-mover' id='curMover'></div>
    <button id='cusd' data-cur='USD'>$</button>
    <button id='crub' data-cur='RUB'>₽</button>
   </div>
   <div class='pill-group'>
    <div class='pill-mover' id='langMover'></div>
    <button id='lru' data-lang='ru'>RU</button>
    <button id='len' data-lang='en'>EN</button>
   </div>
  </div>
 </div>
 <div id='view' class='view'></div>
</div>
<div class='nav'>
 <button id='nav-catalog' data-tab='catalog'><span class='ic'>&#128722;</span><span id='nl-cat'>Catalog</span></button>
 <button id='nav-cart'    data-tab='cart'>   <span class='ic'>&#9829;</span><span id='nl-cart'>Cart</span><span id='cartBadge' class='nbadge' style='display:none'>0</span></button>
 <button id='nav-cabinet' data-tab='cabinet'><span class='ic'>&#128100;</span><span id='nl-cab'>Profile</span></button>
</div>
<div class='backdrop' id='backdrop'><div class='sheet' id='sheet'></div></div>
<div class='toast' id='toast'></div>

function money(x){
 x=Number(x)||0;
 if(state.currency==='RUB')return numf(Math.round(x*state.rate))+' \u20bd';
 return '$'+(Math.round(x*100)/100).toFixed(2);
}
function moneyBoth(x){
 x=Number(x)||0;
 const u='$'+(Math.round(x*100)/100).toFixed(2);
 const r=numf(Math.round(x*state.rate))+' \u20bd';
 return state.currency==='RUB'?(r+' \u00b7 '+u):(u+' \u00b7 '+r);
}
function numf(n){let s=String(Math.round(n)),o='',c=0;for(let i=s.length-1;i>=0;i--){o=s[i]+o;c++;if(c%3===0&&i>0)o='\u00a0'+o;}return o;}
const withMk=u=>Math.round(u*(1+MARKUP)*100)/100;
function unitPrice(p){return p.price!=null?Math.round(Number(p.price)*100)/100:withMk(p.base);}
function discPct(p){if(!p.face)return 0;const pr=unitPrice(p);if(pr>=Number(p.face))return 0;return Math.round((1-pr/Number(p.face))*100);}
function rateK(p,u){return (p.tierUnits&&u>=p.tierUnits)?p.tierRate:p.base;}
function price1k(p,u){
  const rate = rateK(p,u);
  const mk = 1 + MARKUP;
  if(p.kind === 'perUnit') return Math.round(u * rate * mk * 100) / 100;
  return Math.round(u/1000*rate*mk*100)/100;
}
function minLine(p){
  const mk = 1 + MARKUP;
  if(p.kind==='per1000' || p.kind==='perUnit') return Math.max(Math.round((p.min||0)*rateK(p,0)*mk*100)/100, 0);
  return 0;
}

function persist(){
 localStorage.setItem('os_lang',state.lang);
 localStorage.setItem('os_authed',state.authed?'1':'0');
 localStorage.setItem('os_user',JSON.stringify(state.userData));
 localStorage.setItem('os_cur',state.currency);
 localStorage.setItem('os_rate',String(state.rate));
 localStorage.setItem('os_cart',JSON.stringify(state.cart));
 localStorage.setItem('os_hist',JSON.stringify(state.history));
 localStorage.setItem('os_contact',state.contact);
}
async function loadRate(){
 const urls=['https://open.er-api.com/v6/latest/USD','https://api.frankfurter.app/latest?from=USD&to=RUB'];
 for(const url of urls){
  try{
   const j=await(await fetch(url,{cache:'no-store'})).json();
   const r=Number(j&&j.rates&&j.rates.RUB);
   if(r>1){state.rate=r;persist();render();return;}
  }catch(e){}
 }
}
function cartTotal(){return Math.round(state.cart.reduce((s,c)=>s+c.line,0)*100)/100;}
function cartCount(){return state.cart.reduce((s,c)=>s+(c.kind==='per1000'?1:c.qty),0);}
function findProduct(id){for(const c of CATALOG){for(const p of(c.items||[]))if(p.id===id)return p;}return null;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function haptic(t){try{if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred(t);}catch(e){}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('show'),1800);}
function updateBadges(){const n=cartCount();const b=document.getElementById('cartBadge');n>0?(b.style.display='grid',b.textContent=n):b.style.display='none';}

function animateCart() {
  const navCart = document.getElementById('nav-cart');
  if (navCart) {
    navCart.classList.remove('cart-pop');
    void navCart.offsetWidth; // trigger reflow
    navCart.classList.add('cart-pop');
  }
}

function addFixed(p){
  if(!p)return;
  let e=state.cart.find(c=>c.id===p.id);
  if(e)e.qty++;
  else{e={id:p.id,title:p.title,emoji:p.emoji,kind:'fixed',qty:1,unit:''};state.cart.push(e);}
  e.line=Math.round(unitPrice(p)*e.qty*100)/100;
  persist(); haptic('light'); animateCart(); updateBadges(); updateMain();
}

function upsert1k(p,units){
  const line=price1k(p,units);
  let e=state.cart.find(c=>c.id===p.id);
  if(e){e.qty=units;e.line=line;}
  else state.cart.push({id:p.id,title:p.title,emoji:p.emoji,kind:'per1000',qty:units,unit:p.unit,line:line});
  persist(); haptic('light'); animateCart(); updateBadges(); updateMain();
}
function changeQty(id,d){const e=state.cart.find(c=>c.id===id);if(!e)return;const p=findProduct(id);e.qty+=d;if(e.qty<=0)state.cart=state.cart.filter(c=>c.id!==id);else e.line=Math.round(unitPrice(p)*e.qty*100)/100;persist();haptic('light');render();updateBadges();updateMain();}
function removeItem(id){state.cart=state.cart.filter(c=>c.id!==id);persist();haptic('light');toast(T('removed'));render();updateBadges();updateMain();}

  if(p.kind==='per1000') return money(withMk(p.base))+' <small>/ '+T('perK')+' '+p.unit+'</small>';
  if(p.kind==='perUnit') return money(withMk(p.base))+' <small>/ '+p.unit+'</small>';

}

function productHTML(p){
  const note=p.note?'<div class="n">'+esc(tt(p.note))+'</div>':'';

  const off=discPct(p);
  const badge=off>0?'<div class="badge-tag">\u2212'+off+'%</div>':'';

function openSheet(id){const p=findProduct(id);if(!p)return;sheetItem=p;sheetUnits=p.def||1000;renderSheet();document.getElementById('backdrop').classList.add('show');haptic('light');}
function closeSheet(){document.getElementById('backdrop').classList.remove('show');sheetItem=null;}
function sheetStep(d){if(!sheetItem)return;const st=sheetItem.step||1000;sheetUnits=Math.max(st,sheetUnits+d*st);renderSheet();}
function sheetInput(v){sheetUnits=parseInt(v.replace(/[^0-9]/g,''))||0;renderSheetPrice();}
function renderSheet(){
  const p=sheetItem;if(!p)return;
  const s=document.getElementById('sheet');
  const title = p.title ? tt(p.title) : 'Product';
  s.innerHTML='<div class="grab"></div><h3>'+p.emoji+' '+esc(title)+'</h3><div class="sub">'+money(withMk(p.base))+' '+T('perK')+' '+p.unit+'</div><div class="stepper"><button data-sheetstep="-1">\u2212</button><input id="sunits" inputmode="numeric" value="'+sheetUnits+'" /><button data-sheetstep="1">+</button></div>'+(p.note?'<div class="snote">'+esc(tt(p.note))+'</div>':'')+'<div id="sprice" class="sheet-price"></div><div id="stier" class="tier-note"></div><button class="cta" data-sheetconfirm="1">'+T('addBtn')+'</button><button class="cta dark" style="margin-top:8px" data-sheetclose="1">'+T('close')+'</button>';
  renderSheetPrice();
}

function renderSheetPrice(){const p=sheetItem;if(!p)return;const el=document.getElementById('sprice'),tel=document.getElementById('stier');if(el)el.textContent=money(price1k(p,sheetUnits));if(tel)tel.textContent=(p.tierUnits&&sheetUnits>=p.tierUnits)?T('tierOn'):'';
}
function confirmSheet(){const p=sheetItem;if(!p)return;if(sheetUnits<=0){toast(T('choose'));return;}if(price1k(p,sheetUnits)<minLine(p)){toast(T('min'));return;}upsert1k(p,sheetUnits);closeSheet();}
function copyText(t){try{navigator.clipboard?navigator.clipboard.writeText(String(t)):(()=>{const ta=document.createElement('textarea');ta.value=String(t);document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);})();}catch(e){}toast(T('copied'));haptic('light');}
function cryptoRows(){return CRYPTO.map(w=>'<div class="crow"><div class="ctop"><b>'+w.emoji+' '+w.label+'</b><button class="cta" style="width:auto;padding:6px 12px;margin:0;font-size:12px" data-copy="'+w.addr+'">'+T('copy')+'</button></div><div class="addr">'+w.addr+'</div></div>').join('');}
function openCryptoInfo(){const html='<div class="grab"></div><h3>\uD83E\uDE99 '+T('payCrypto')+'</h3><div class="sub">'+T('cryptoInfo')+'</div>'+cryptoRows()+'<button class="cta dark" style="margin-top:8px" data-sheetclose="1">'+T('close')+'</button>';const s=document.getElementById('sheet');s.innerHTML=html;document.getElementById('backdrop').classList.add('show');haptic('light');}
function openPayCrypto(){const total=cartTotal();if(total<MIN_ORDER){toast(T('minToast'));return;}const html='<div class="grab"></div><h3>\uD83E\uDE99 '+T('payCrypto')+'</h3><div class="sub">'+T('total')+': '+moneyBoth(total)+'</div>'+cryptoRows()+'<div class="snote">'+T('cryptoInfo')+'</div><button class="cta" data-paycrypto="1">'+T('sendOrder')+'</button><button class="cta dark" style="margin-top:8px" data-sheetclose="1">'+T('close')+'</button>';const s=document.getElementById('sheet');s.innerHTML=html;document.getElementById('backdrop').classList.add('show');haptic('light');}
function openTopup(){const html='<div class="grab"></div><h3>\uD83D\uDCB0 '+T('topupBtn')+'</h3><div class="sub">'+T('cryptoInfo')+'</div>'+cryptoRows()+'<div class="snote">\uD83D\uDCE8 '+T('support')+': @'+SUPPORT+'</div><button class="cta dark" style="margin-top:8px" data-sheetclose="1">'+T('close')+'</button>';const s=document.getElementById('sheet');s.innerHTML=html;document.getElementById('backdrop').classList.add('show');haptic('light');}
function openSupport(){const url='https://t.me/'+SUPPORT;if(tg&&tg.openTelegramLink)tg.openTelegramLink(url);else window.open(url,'_blank');}

function updateMain(){
 if(!tg||!tg.MainButton)return;
 if(state.tab==='cart'&&state.cart.length>0){
  const tot=cartTotal();
  try{tg.MainButton.setParams({text:tot>=MIN_ORDER?(T('checkout')+' \u2022 '+money(tot)):T('minToast'),color:'#ffffff',text_color:'#000000'});tg.MainButton.show();}catch(e){}
 }else{try{tg.MainButton.hide();}catch(e){}}
}

async function submitOrder(order){
 if(API_BASE){try{const r=await fetch(API_BASE.replace(/\/$/,'')+'/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:(tg&&tg.initData)||'',order:order})});if(r.ok){const j=await r.json();if(j&&j.ok)return 'api';}}catch(e){}}
 try{if(tg&&typeof tg.sendData==='function'){tg.sendData(JSON.stringify(order));return 'senddata';}}catch(e){}
 return 'fail';
}
async function checkout(){
 const total=cartTotal();
 if(total<MIN_ORDER){toast(T('minToast'));go('cart');return;}
 const ce=document.getElementById('contact');
 const contact=(ce?ce.value:state.contact||'').trim();
 if(!contact){toast(T('needContact'));if(ce)ce.focus();return;}
 state.contact=contact;
 const order={type:'order',currency:state.currency,rate:state.rate,total:total,contact:contact,lang:state.lang,items:state.cart.map(c=>({id:c.id,title:tt(c.title),qty:c.qty,unit:c.unit||'',amount:c.line}))};
 const rec={id:'OCS-'+Math.random().toString(16).slice(2,10).toUpperCase(),ts:Date.now(),total,items:state.cart.length,status:'sent',currency:state.currency};
 state.history.unshift(rec);state.cart=[];persist();
 const res=await submitOrder(order);
 const ok=res==='api'||res==='senddata';
 try{if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred(ok?'success':'error');}catch(e){}
 showSent(rec.id,ok);
}
async function loadMe(){
 if(!API_BASE)return;
 try{const r=await fetch(API_BASE.replace(/\/$/,'')+'/api/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:(tg&&tg.initData)||''})});const j=await r.json();if(j&&j.ok){state.balance=Number(j.balance)||0;state.discount=Number(j.discount)||0;if(state.tab==='cabinet')render();}}catch(e){}
}

document.addEventListener('click',e=>{
 if(e.target&&e.target.id==='backdrop'){closeSheet();return;}
 const el=e.target.closest('[data-tab],[data-lang],[data-cur],[data-cat],[data-add],[data-sheet],[data-qty],[data-rm],[data-action],[data-sheetstep],[data-sheetconfirm],[data-sheetclose],[data-checkout],[data-copy],[data-topup],[data-paycrypto],[data-paycryptoopen],[data-login]');
 if(!el)return;const d=el.dataset;
 if(d.tab)go(d.tab);
 else if(d.lang)setLang(d.lang);
 else if(d.cur){state.currency=d.cur==='RUB'?'RUB':'USD';persist();haptic('light');render();}
 else if(d.cat)setCat(d.cat);
 else if(d.add)addFixed(findProduct(d.add));
 else if(d.sheet)openSheet(d.sheet);
 else if(d.qty!==undefined&&d.qty!=='')changeQty(d.qty,parseInt(d.d));
 else if(d.rm)removeItem(d.rm);
 else if(d.action==='support')openSupport();
 else if(d.action==='togglelang')setLang(state.lang==='ru'?'en':'ru');
 else if(d.action==='togglecur'){state.currency=state.currency==='USD'?'RUB':'USD';persist();haptic('light');render();}
 else if(d.action==='topup')openTopup();
 else if(d.action==='cryptoinfo')openCryptoInfo();
 else if(d.sheetstep!==undefined)sheetStep(parseInt(d.sheetstep));
 else if(d.sheetconfirm!==undefined)confirmSheet();
 else if(d.sheetclose!==undefined)closeSheet();
 else if(d.checkout)checkout();
 else if(d.copy)copyText(d.copy);
 else if(d.paycryptoopen)openPayCrypto();
 else if(d.paycrypto){closeSheet();checkout();}
 else if(d.login)doLogin();
});
document.addEventListener('input',e=>{
 if(!e.target)return;
 if(e.target.id==='contact'){state.contact=e.target.value;persist();}
 else if(e.target.id==='sunits')sheetInput(e.target.value);
});

function initDragScroll(el) {
  let isDown = false, startX, scrollLeft;
  el.addEventListener('mousedown', e => {
    isDown = true;
    el.style.cursor = 'grabbing';
    startX = e.pageX - el.offsetLeft;
    scrollLeft = el.scrollLeft;
  });
  el.addEventListener('mouseleave', () => { isDown = false; el.style.cursor = 'grab'; });
  el.addEventListener('mouseup', () => { isDown = false; el.style.cursor = 'grab'; });
  el.addEventListener('mousemove', e => {
    if(!isDown) return;
    e.preventDefault();
    const x = e.pageX - el.offsetLeft;
    const walk = (x - startX) * 2;
    el.scrollLeft = scrollLeft - walk;
  });
  el.style.cursor = 'grab';
}

  {ru:'\u041b\u0443\u0447\u0448\u0438\u0435 \u0446\u0435\u043d\u044b', en:'Best Prices'},
  {ru:'\u041c\u0433\u043d\u043e\u0432\u0435\u043d\u043d\u0430\u044f \u0432\u044b\u0434\u0430\u0447\u0430', en:'Instant Delivery'},
  {ru:'\u0413\u0430\u0440\u0430\u043d\u0442\u0438\u044f \u043a\u0430\u0447\u0435\u0441\u0442\u0432\u0430', en:'Quality Guarantee'},
  {ru:'\u041f\u043e\u0434\u0434\u0435\u0440\u0436\u043a\u0430 24/7', en:'24/7 Support'}
];
let advIdx = 0;

function initCyclingText() {
  setInterval(() => {
    const el = document.getElementById('adv-text');
    if(!el) return;
    el.classList.add('text-out');
    setTimeout(() => {
      advIdx = (advIdx + 1) % ADV.length;
      el.textContent = tt(ADV[advIdx]);
      el.classList.remove('text-out');
      el.classList.add('text-in');
      setTimeout(() => el.classList.remove('text-in'), 50);
    }, 500);
  }, 3000);
}

function init(){
 document.documentElement.lang=state.lang;
 if(tg){
  try{
   tg.ready();tg.expand();
   if(tg.setHeaderColor)tg.setHeaderColor('#000000');

   if(tg.MainButton)tg.MainButton.onClick(checkout);
  }catch(e){}
 }
 renderLogin();
 if(document.getElementById('login')&&state.authed)document.getElementById('login').classList.add('hidden');
 render();
 initCyclingText();
 setTimeout(() => {
   updateMovers();
   const chips = document.querySelector('.chips');
   if(chips) initDragScroll(chips);
 }, 100);
 loadRate();
 loadMe();
}
init();
